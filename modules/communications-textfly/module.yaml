apiVersion: modules.gigalibs.io/v1alpha1
kind: Module
metadata:
  name: communications-textfly
  displayName: Universal Omnichannel Communications & Unified Inbox
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-041
spec:
  standalone: true
  requiredModules: []
  optionalModules:
    - workflow-studio
    - universal-rule-pro
    - accounts-receivable
    - spend-management
    - esignature
    - physical-operations-cmms
    - platform-rbac
  capabilities:
    - omnichannel-messaging-gateway
    - unified-inbox-conversation-threads
    - customer-contact-profiles
    - twilio-sms-whatsapp-adapter
    - azure-communication-services-adapter
    - smtp-imap-email-dispatch-ingestion
    - reach-audience-campaigns
    - delivery-queue-retry-backoff
    - support-sla-escalation-queues
  ui:
    application: apps/workflow-platform
    basePath: /communications
  api:
    application: modules/communications-textfly/apps/agent-runtime
    port: 4700
  storage:
    schema: gigalibs_textfly
    tables:
      - tenants
      - contacts
      - conversations
      - messages
      - channel_configs
      - connector_configs
      - message_templates
      - delivery_jobs
      - audience_segments
      - reach_journeys
      - support_cases
