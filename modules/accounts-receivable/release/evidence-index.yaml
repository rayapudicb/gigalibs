apiVersion: release.gigalibs.io/v1alpha1
kind: ModuleEvidenceIndex
metadata:
  module: accounts-receivable
  version: 0.1.0-dev
spec:
  certification: not-certified
  workItem: WI-OI-019
  currentGate: G4
  evidence:
    requirements: docs/requirements/PRODUCT_REQUIREMENTS.md
    architecture: docs/architecture/ARCHITECTURE.md
    openapi: contracts/openapi.yaml
    asyncapi: contracts/asyncapi.yaml
    dataModel: db/schema/AR_DATA_MODEL.md
    testPlan: tests/README.md
  implementation:
    domain: domain/src/invoice.ts
    api: apps/api/src
    web: apps/web
    worker: apps/worker/src
    deployment: deploy
  migrations:
    - db/migrations/000001_ar_foundation.up.sql
    - db/migrations/000002_ar_outbox_delivery.up.sql
    - db/migrations/000003_ar_ledger_seals_and_installments.up.sql
    - db/migrations/000004_ar_settlements_and_wip.up.sql
    - db/migrations/000005_ar_customer_contacts_and_billing_entity_expand.up.sql
    - db/migrations/000006_ar_drop_foundation_tax_check.up.sql
    - db/migrations/000007_ar_invoice_deliveries.up.sql
    - db/migrations/000008_ar_payments_phase4.up.sql
    - db/migrations/000009_ar_credit_notes_aging.up.sql
    - db/migrations/000010_form_definitions.up.sql
    - db/migrations/RECOVERY.md
  tests:
    - name: foundation unit tests
      command: pnpm --filter @gigalibs/ar-domain test
      status: passing-in-local-g4
    - name: API unit tests (payments, credit-notes, deliveries, pagination, persistence-helpers, runtime-config)
      command: pnpm --filter @gigalibs/ar-api test
      status: passing-in-local-g4
    - name: worker unit tests
      command: pnpm --filter @gigalibs/ar-worker test
      status: passing-in-local-g4
    - name: PostgreSQL 16 migration and isolation verification
      source: db/verification
      status: passing-in-disposable-local-g4
    - name: standalone Playwright lifecycle
      command: pnpm --filter @gigalibs/ar-e2e test
      status: passing-in-disposable-local-g4
    - name: suite security boundary and anti-mock enforcement
      command: pnpm vitest run apps/workflow-platform/__tests__/ar-boundary.test.ts
      status: passing-in-local-g4
  humanApprovals: []
  productionObservation: null
