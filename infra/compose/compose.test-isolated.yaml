# WI-OI-120bo: Table 1 / P2P-O2C isolated test stack (Docker Compose project gigalibs-test only).
# Never combine with project gigalibs-configuration-local (UAT).
services:
  test-postgres:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=128m
    shm_size: 256m
    environment:
      POSTGRES_USER: gigalibs
      POSTGRES_DB: gigalibs
      POSTGRES_PASSWORD: ${TEST_DATABASE_SUPERUSER_PASSWORD:?TEST_DATABASE_SUPERUSER_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "password_encryption=scram-sha-256"]
    stop_grace_period: 60s
    mem_limit: 2g
    volumes:
      - test-database:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${TEST_POSTGRES_HOST_PORT:?TEST_POSTGRES_HOST_PORT is required}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigalibs -d gigalibs"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    labels:
      com.gigalibs.profile-key: ${PROFILE_KEY:?PROFILE_KEY is required}
      com.gigalibs.execution-class: ${EXECUTION_CLASS:?EXECUTION_CLASS is required}
      com.gigalibs.release-id: ${RELEASE_ID:?RELEASE_ID is required}
      org.opencontainers.image.revision: ${SOURCE_REVISION:?SOURCE_REVISION is required}
      com.gigalibs.source-state-sha256: ${SOURCE_STATE_SHA256:?SOURCE_STATE_SHA256 is required}

  migrations:
    depends_on:
      test-postgres:
        condition: service_healthy

  connector-hub-migrations:
    depends_on:
      test-postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  analytics-migrations:
    depends_on:
      test-postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  cmms-migrations:
    depends_on:
      test-postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  ar-migrations:
    depends_on:
      test-postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

volumes:
  test-database:
    name: gigalibs-test-database

networks:
  default:
    name: gigalibs-test
