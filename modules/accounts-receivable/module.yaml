# WI-OI-120aj (owner decision E1a, 2026-10-14): the AR API (`apps/api`) is left out of the default build (root
# `package.json` `build`) until it is rebuilt on the module SDK as M-AR0 (execution plan v3 step 5C). From a clean
# checkout it cannot compile: `@gigalibs/custom-fields-nest` and `@gigalibs/forms-engine-nest` have no build script,
# the former has a syntax error and type drift (e4e4a69 and earlier), and the API passes options their types lack.
# Local trees hid this with a stale `dist/` from 2026-09-14. The module is CONTAINED and not deployed.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: accounts-receivable
  displayName: Customer Invoicing and Accounts Receivable
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-019
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules:
    - ledger
    - subscription-metering
  capabilities:
    - customers
    - invoice-drafts
    - invoice-issue
    - committed-event-delivery
    - audit
  plannedCapabilities:
    - event-billing-summary
    - source-backed-invoice-generation
    - supplemental-invoice-families
    - markup-policies
    - missed-billing-control
    - controlled-rebilling
    - invoice-template-versions
    - configurable-numbering
    - accounting-system-reconciliation
    - document-delivery
    - payments
    - credit-notes
    - collections
    - reconciliation
    - aging
  ui:
    application: apps/web
    basePath: /ar
  api:
    application: apps/api
    version: v1
    openapi: contracts/openapi.yaml
  worker:
    application: apps/worker
  events:
    asyncapi: contracts/asyncapi.yaml
    emits:
      - ar.invoice.issued.v1
    plannedEmits:
      - ar.invoice.balance-changed.v1
    consumes: []
  identity:
    protocol: oidc
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_ar
    crossSchemaAccess: false
  deployment:
    modes:
      - suite
      - customer-cloud
      - self-contained
      - customer-postgresql-schema
    artifacts:
      - ar-web
      - ar-api
      - ar-worker
      - ar-migrations
  health:
    liveness: /health/live
    readiness: /health/ready
  commercialMeter:
    owner: subscription-metering
    usageEvent: ar.invoice.issued.v1
    dimension: issued_invoices
    idempotencyField: invoiceId
  certification:
    status: not-certified
    evidence: release/evidence-index.yaml
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: accounts-receivable
      name: Accounts Receivable
      navigationLabel: Accounts Receivable
      area: Finance
      navigationGroup: Financial Operations
      route: /ar
      iconKey: arrow-left-right
      readiness: CONTAINED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: ar:read
      platformInspection: true
      reason: Customer, draft and issuance domain with tests and migrations. Its service is not part of the running local stack. Frozen and locked (ADR-0016 F6).
      navigationOrder: 110
      personas: [C_LEVEL]
