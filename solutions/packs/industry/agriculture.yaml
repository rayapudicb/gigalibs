# Industry pack: Agriculture (WI-OI-107, ADR-0016 F10). Validated and compiled by `pnpm modules:catalog`.
# A starter pack, written as data only: it proves a new industry needs no code. The full agriculture pack (crops,
# inputs, pest codes, personas, workflows and dashboards) comes with agriculture plan phase 5, as the layer engines
# arrive (WI-OI-074 to 078). Demo profile amounts are synthetic shape parameters for Demo Lab only.
formatVersion: 2
slug: agriculture
label: Agriculture
emoji: 🌾
version: '1.0'
description: Farms, fields and blocks; field crews, harvest runs and seasonal agreements.
modules:
  gigaops:
    vocabulary:
      terms:
        workUnit: Harvest Run
        role: Crew
        position: Field Position
        worker: Farm Hand
        agreement: Seasonal Agreement
      roleLabels:
        workforce_manager: Farm Manager
        ops_supervisor: Field Supervisor
        time_approver: Crew Lead
      classificationLabels:
        W2: Permanent Farm Hand
        CASUAL: Seasonal Worker
        CONTRACTOR: Labour Contractor
    lists:
      certifications:
        - slug: pesticide-applicator
          label: Pesticide Applicator
          required: true
        - slug: tractor-licence
          label: Tractor Licence
          required: false
        - slug: first-aid
          label: First Aid
          required: false
    capabilities:
      defaultPayTypeCode: HOURLY
      features:
        perDiem: false
        flatRates: true
        guaranteedHours: false
        unionSupport: false
        vendorPay: true
        clockPunches: true
        mobileTimesheet: true
  geospatial:
    lists:
      placeTypes:
        - code: FARM
          label: Farm
        - code: FIELD
          label: Field
        - code: BLOCK
          label: Block
demo:
  currency: USD
  regions: 3
  sitesPerRegion: 8
  zonesPerSite: 6
  labourHoursPerSitePerDay: 180
  labourCostPerHour: 14
  spendPerSitePerDay: 6500
  downtimeMinutesPerSitePerDay: 20
  carbonKgPerLabourHour: 3.1
