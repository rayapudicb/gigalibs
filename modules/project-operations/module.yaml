apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: project-operations
  displayName: Project Operations
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-129
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules: []
  capabilities:
    - project-operations-records
    - project-gantt-burn
  ui:
    application: apps/workflow-platform
    basePath: /project-operations
    package: '@gigalibs/project-operations-web'
    pages:
      - route: /project-operations
        component: ProjectOperationsWorkspace
  api:
    application: apps/api
    port: 4790
    upstream:
      key: project-operations
      serviceHostname: module-host
      environmentKey: PROJECT_OPERATIONS_API_URL
      basePath: /project-operations
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_project_operations
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: project-operations
      name: Project Operations
      navigationLabel: Project Operations
      area: Project Operations
      navigationGroup: Workforce & Operations
      route: /project-operations
      iconKey: boxes
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: project-operations.records.read
      personas: [OPERATIONS_SUPERVISOR]
      platformInspection: false
      reason: Generated by module:new. It stays PLANNED until it passes `pnpm module:conformance project-operations --live` and is reviewed.
      navigationOrder: 360
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/project-operations]
    catalogKey: project-operations
    audience: gigalibs-project-operations-api
    upstream: project-operations
    signingKeyEnvironment: PROJECT_OPERATIONS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: PROJECT_OPERATIONS
    routeNoun: Project Operations
    serviceName: Project Operations
    entitlementName: Project Operations
    routes:
      - { path: 'v1/records', GET: project-operations.records.read, POST: project-operations.records.manage }
      - { path: 'v1/records/{id}', GET: project-operations.records.read, PATCH: project-operations.records.manage }
      - { path: 'v1/projects/{id}/wip-accrual', POST: project-operations.cost.post }
      - { path: 'v1/projects/{id}/bill-time-materials', POST: project-operations.billing.post }
      - { path: 'v1/projects/{id}/bill-milestone', POST: project-operations.billing.post }
      - { path: 'v1/projects', GET: project-operations.insights.read }
      - { path: 'v1/projects/{id}/gantt', GET: project-operations.insights.read }
      - { path: 'v1/projects/{id}/burn-matrix', GET: project-operations.insights.read }
