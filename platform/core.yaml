# Core surfaces every client gets, served by the control plane and the web shell (ADR-0013).
# `hostedFor` marks a business capability still hosted by the control plane until its module exists.
apiVersion: modules.gigalibs.io/v1
kind: Core
metadata:
  name: core
  displayName: GigaLibs core
  version: 0.1.0
  lifecycle: implementation
  workItem: WI-OI-080
spec:
  catalog:
    - key: tenant-access
      name: Workspace settings
      navigationLabel: Workspace settings
      area: Workspace
      navigationGroup: Settings
      route: /settings
      iconKey: settings
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: tenant:read
      platformInspection: false
      reason: Tenant administration APIs and screens run against the local PostgreSQL reference environment. Not certified.
      navigationOrder: 10
      personas: [C_LEVEL]
      # WI-OI-145: each Settings screen is its own route in the Settings sidebar (formerly ?tab= tabs with emoji).
      menu:
        - key: team
          label: Team & access
          path: /settings
          icon: key-round
        - key: people
          label: People
          path: /settings/people
          icon: users
        - key: organization
          label: Organization & hierarchy
          path: /settings/organization
          icon: building
        - key: plan
          label: Plan & entitlements
          path: /settings/plan
          icon: credit-card
        - key: general
          label: General & localization
          path: /settings/general
          icon: globe
        - key: security
          label: Security & SSO
          path: /settings/security
          icon: shield-check
    - key: personal-security
      name: My profile & security
      navigationLabel: My profile & security
      area: Account
      navigationGroup: Settings
      route: /settings/profile
      iconKey: key-round
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: profile:*
      platformInspection: false
      reason: Profile, password, TOTP and recovery flows run against the local reference environment. Not certified.
      navigationOrder: 20
      personas: [C_LEVEL, OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER, CUSTOMER_GUEST]
    - key: execution-runs
      name: Run history
      navigationLabel: Run history
      area: Automation
      navigationGroup: Settings
      route: /runs
      iconKey: file-check
      readiness: REVIEW
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: true
      requiredPermission: runs:read
      platformInspection: false
      reason: Run history screen over the core workflow tables. No run has been produced; workflow moves to Workflow Studio (ADR-0016 F3).
      navigationOrder: 40
    - key: exceptions-recovery
      name: Processing exceptions
      navigationLabel: Processing exceptions
      area: Automation
      navigationGroup: Settings
      route: /exceptions
      iconKey: shield-alert
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: exceptions:read
      platformInspection: false
      reason: Canonical exception and recovery records are available for controlled local evaluation.
      navigationOrder: 50
    - key: approval-queue
      name: Invoice approvals
      navigationLabel: Invoice approvals
      area: Finance
      navigationGroup: Financial Operations
      route: /actions
      iconKey: check-circle
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: actions:read
      platformInspection: false
      reason: Hosted by the core until the Procurement module exists (ADR-0016 F4). Governed AP approval records are available for controlled local evaluation.
      hostedFor: procurement
      navigationOrder: 105
      personas: [C_LEVEL, OPERATIONS_SUPERVISOR]
    - key: value-ledger
      name: Business Value Ledger
      navigationLabel: Business value
      area: Intelligence
      navigationGroup: Intelligence
      route: /value
      iconKey: check-circle
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: value:read
      platformInspection: false
      reason: Persisted value evidence is available for controlled local evaluation.
      navigationOrder: 70
      personas: [C_LEVEL]
    - key: invoice-matching
      name: 3-Way Match Invoices
      navigationLabel: Invoice matching
      area: Finance
      navigationGroup: Financial Operations
      route: /ap
      iconKey: file-text
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: ap:read
      platformInspection: false
      reason: Hosted by the core until the Procurement module exists (ADR-0016 F4). The reference AP outcome is available for controlled local evaluation.
      navigationOrder: 100
      personas: [C_LEVEL]
      hostedFor: procurement
    - key: dynamic-forms
      name: Forms & apps
      navigationLabel: Forms & apps
      area: Automation
      navigationGroup: Settings
      route: /configuration
      iconKey: sparkles
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: configuration:read
      platformInspection: true
      reason: The governed PostgreSQL-backed designer, maker-checker lifecycle, immutable publication, activation, shared renderer, tenant-profile adapter and tenant-created record pages are available for controlled local UAT under WI-OI-039. Independent accessibility, security, recovery and product acceptance remain open.
      navigationOrder: 170
      personas: [OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER, CUSTOMER_GUEST]
    - key: platform-control
      name: Platform Control Tower
      navigationLabel: Platform Control Tower
      area: Platform
      navigationGroup: Settings
      route: /platform-admin
      iconKey: server
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: false
      trialEligible: false
      requiredPermission: null
      platformInspection: false
      reason: Platform control is global operator authority, not a tenant entitlement.
      navigationOrder: 190
      # WI-OI-145: each screen is a Settings sidebar entry.
      menu:
        - { key: overview, label: Platform Control Tower, path: /platform-admin, icon: server }
        - { key: users, label: Platform users, path: /platform-admin/users, icon: users }
    - key: solution-packs
      name: Solution Packs
      navigationLabel: Solution Packs
      area: Solutions
      navigationGroup: Intelligence
      route: /solutions
      iconKey: boxes
      readiness: REVIEW
      maturity: CONCEPT
      entitlementEligible: true
      trialEligible: true
      requiredPermission: solutions:read
      platformInspection: false
      reason: Shows an unavailable-capability page. Industry packs are planned at the solution layer (ADR-0016 F10, WI-OI-107).
      navigationOrder: 310
      personas: [C_LEVEL]
    - key: module-marketplace
      name: Modules & plan
      navigationLabel: Modules & plan
      area: Workspace
      navigationGroup: Settings
      route: /marketplace
      iconKey: shopping-bag
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: marketplace:read
      platformInspection: false
      reason: The tenant's plan and modules, from the kernel's entitlements (Settings, Plan). Platform operators enable modules in Platform Control. No purchasing or billing (ADR-0013).
      navigationOrder: 200
