apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: platform-rbac
  displayName: Centralized Platform Control Panel, RBAC & Marketplace
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-028
spec:
  standalone: true
  # ADR-0016 F6, owner decision 2026-09-29: department/group roles merge into the kernel's departments and
  # roles, the Marketplace becomes the kernel's module-enablement page, then this module retires (WI-OI-102g).
  category: capability
  requiredModules: []
  optionalModules:
    - accounts-receivable
    - spend-management
    - tax-configuration
    - multi-currency
    - universal-data-studio
    - universal-rule-pro
    - workflow-studio
    - universal-connector-hub
    - autonomous-recovery-studio
  capabilities:
    - centralized-platform-control-tower
    - tenant-fleet-lifecycle
    - dynamic-subdomain-routing
    - zero-ghost-schemas-isolation
    - zero-downtime-modular-hydration
    - self-service-module-marketplace
    - transactional-purchase-ledger
    - hierarchical-department-group-rbac
    - declarative-client-can-authorization
    - just-in-time-impersonation-audit
  ui:
    application: apps/workflow-platform
    basePaths:
      - /platform-admin
      - /marketplace
      - /settings
  api:
    application: apps/api
    port: 4300
  storage:
    schema: gigalibs_platform
    tables:
      - platform_tenants
      - platform_users
      - platform_settings
      - module_catalog
      - module_purchases
      - billing_invoices
      - ledger_transactions
      - platform_audit_events
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: module-marketplace
      name: Module Marketplace
      navigationLabel: Module Marketplace & Usage Billing
      area: Commercial
      navigationGroup: Platform
      route: /marketplace
      iconKey: shopping-bag
      readiness: REVIEW
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: true
      requiredPermission: marketplace:read
      platformInspection: false
      reason: Module catalogue and department/group roles service code with tests. Not running; merging into the kernel (ADR-0016 F6, WI-OI-102g). No billing is claimed.
      navigationOrder: 200
