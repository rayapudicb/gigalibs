apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: autonomous-recovery-studio
  displayName: Autonomous Cash Leakage & Recovery Studio
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-027
spec:
  standalone: true
  requiredModules: []
  optionalModules:
    - workflow-studio
    - universal-connector-hub
    - universal-data-studio
    - multi-currency
    - universal-rule-pro
    - accounts-receivable
    - spend-management
    - tax-configuration
  capabilities:
    - duplicate-invoice-detection
    - missed-tax-exemption-audit
    - unclaimed-credit-recovery
    - contract-pricing-creep-detection
    - historical-shadow-audit-scanner
    - automated-clawback-dispatch
    - dual-gate-accuracy-protocol
    - vendor-settlement-claims
  ui:
    application: apps/workflow-platform
    basePath: /recovery
  api:
    application: apps/api
    port: 4200
  storage:
    schema: gigalibs_recovery
    tables:
      - detected_leaks
      - recovery_claims
      - historical_scan_sessions
      - audit_events
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: autonomous-recovery
      name: Autonomous Recovery Studio
      navigationLabel: Autonomous Recovery Studio
      area: Finance
      navigationGroup: Financial Operations
      route: /recovery
      iconKey: recovery
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: recovery:read
      platformInspection: true
      reason: Tenant recovery configuration and persisted read models are available. Detection needs an authoritative source contract, and external recovery actions remain unavailable without provider receipts.
      navigationOrder: 150
