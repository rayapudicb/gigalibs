apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: process-safety-screening
  displayName: SPEED Process Safety Screening
  version: 0.1.0-dev
  lifecycle: implementation
  # WI-OI-120bn (SPEED Stage 1, plan v1.4); this scaffold and Projects: WI-OI-120bw (slice S3).
  workItem: WI-OI-120
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules: []
  capabilities:
    - speed-projects
    - outbox-events
    - audit
  plannedCapabilities:
    - speed-substances
    - speed-routes
    - speed-screening-results
    - speed-interaction-findings
    - speed-dossiers
  # SPEED's screens are metadata windows over the module's record dispatcher (plan v1.4 §3.3).
  ui:
    basePath: /speed
    package: '@gigalibs/process-safety-screening-web'
    # WI-OI-120cb: one page per screen, reached from the sidebar entry's menu as EAM's are; /speed opens Projects.
    pages:
      - route: /speed
        component: SpeedWorkspace
        props:
          section: projects
        sessionPermissions: true
      - route: /speed/projects
        component: SpeedWorkspace
        props:
          section: projects
        sessionPermissions: true
      - route: /speed/routes
        component: SpeedWorkspace
        props:
          section: routes
        sessionPermissions: true
      - route: /speed/substances
        component: SpeedWorkspace
        props:
          section: substances
        sessionPermissions: true
      - route: /speed/library
        component: SpeedWorkspace
        props:
          section: library
        sessionPermissions: true
      - route: /speed/criteria
        component: SpeedWorkspace
        props:
          section: criteria
        sessionPermissions: true
      # WI-OI-120cc: the audit trail, a module page (screen spec §3.3).
      - route: /speed/audit
        component: SpeedWorkspace
        props:
          section: audit
        sessionPermissions: true
      # WI-OI-120cc (S9b): the business outcomes, a module page; the targets are the BRD's (BO-2 ≤ 2 h, BO-3 100 %).
      - route: /speed/outcomes
        component: SpeedWorkspace
        props:
          section: outcomes
          screeningTargetHours: 2
          screenedTargetPercent: 100
        sessionPermissions: true
    # Registered panels (WI-OI-120bs): the dictionary places them on record tabs; each draws for the record it is shown with.
    panels:
      - componentKey: speed.route-summary
        binding: RECORD
        props:
          compact: { type: BOOLEAN }
      - componentKey: speed.gate-workbench
        binding: RECORD
        props:
          # The reasons a chemist chooses from with every change (FR-AUD-01), separated by "|"; configurable per workspace.
          changeReasons: { type: STRING, required: true }
      - componentKey: speed.ob-chart
        binding: RECORD
        props:
          # The chart's span and ticks, %; the alert band itself comes from the criteria in force.
          axisMinPercent: { type: NUMBER, required: true }
          axisMaxPercent: { type: NUMBER, required: true }
          tickPercent: { type: NUMBER, required: true }
          showTable: { type: BOOLEAN }
          changeReasons: { type: STRING, required: true }
      - componentKey: speed.thermal-panel
        binding: RECORD
        props:
          changeReasons: { type: STRING, required: true }
      - componentKey: speed.green-scorecard
        binding: RECORD
        props:
          showStreams: { type: BOOLEAN }
      - componentKey: speed.criteria-values
        binding: RECORD
      - componentKey: speed.interaction-matrix
        binding: RECORD
        props:
          changeReasons: { type: STRING, required: true }
      - componentKey: speed.library-entries
        binding: RECORD
        props:
          kind: { type: ENUM, required: true, values: [MATERIALS, RULES, REACTION_CLASSES, ENERGETIC_GROUPS] }
      - componentKey: speed.writeup-parser
        binding: RECORD
        props:
          # The reason every applied value is saved with (FR-AUD-01).
          applyReason: { type: STRING, required: true }
      - componentKey: speed.dossier-preview
        binding: RECORD
        props:
          # How often a queued dossier's progress is read, in seconds, and how many earlier dossiers are listed.
          pollSeconds: { type: NUMBER, required: true }
          historyCount: { type: NUMBER, required: true }
  api:
    application: apps/api
    port: 4790
    upstream:
      key: process-safety-screening
      serviceHostname: module-host
      environmentKey: SPEED_API_URL
      basePath: /process-safety-screening
    version: v1
  events:
    emits:
      - speed.project.created.v1
      - speed.project.updated.v1
      - speed.project.archived.v1
    consumes:
      - platform.authorization.revoked.v1
      - platform.organization.version.v1
  identity:
    protocol: signed-platform-context-v1
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_speed
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  runtime:
    generated: true
    hosting: host
    # Results are immutable: a recompute adds a row (NFR-10).
    appendOnlyTables: [audit_events, results]
    readOnlyTables: [auth_revocation_events]
    # WI-OI-120cd: the dossier store and worker (WI-OI-120ca). Unset, generating a dossier answers 503 and the worker idles.
    optionalEnvironment:
      - SPEED_STORAGE_ENDPOINT
      - SPEED_STORAGE_REGION
      - SPEED_STORAGE_BUCKET
      - SPEED_STORAGE_ACCESS_KEY
      - SPEED_STORAGE_SECRET_KEY
      - SPEED_STORAGE_FORCE_PATH_STYLE
      - SPEED_DOSSIER_WORKER_DISABLED
      - SPEED_DOSSIER_WORKER_INTERVAL_MS
  catalog:
    - key: process-safety-screening
      name: SPEED Process Safety Screening
      navigationLabel: Process safety (SPEED)
      area: Process safety
      navigationGroup: Intelligence
      route: /speed
      iconKey: shield-alert
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: speed:read
      platformInspection: false
      reason: SPEED Stage 1 R1 (WI-OI-120bn) is merged on convergence-core with static module conformance 15/15; on UAT (5180, /speed) it opens under UAT preview once entitled and deployed (WI-OI-120cd/120ce).
      navigationOrder: 335
      # Lab leads and chemists; `speed:read` still decides who sees it.
      personas: [OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER]
      # WI-OI-120cb: the sidebar entry expands into SPEED's screens; WI-OI-120cc adds Outcomes.
      menu:
        - { key: projects, label: Projects, path: /speed/projects, icon: layers }
        - { key: routes, label: Routes, path: /speed/routes, icon: workflow }
        - { key: substances, label: Substances, path: /speed/substances, icon: database }
        - { key: library, label: Screening library, path: /speed/library, icon: shield-alert }
        - { key: criteria, label: Screening criteria, path: /speed/criteria, icon: scale }
        - { key: outcomes, label: Outcomes, path: /speed/outcomes, icon: bar-chart }
        - { key: audit, label: Audit trail, path: /speed/audit, icon: file-check }
      # Plan v1.4 §3.2, R1 permissions only; the review, approval and library-governance permissions arrive with R2.
      roles:
        - key: speed-chemist
          name: SPEED Chemist
          description: Enters routes, substances and thermal data, and runs the screening engines.
          permissions: [speed:read, speed.routes.read, speed.routes.write, speed.substances.write, speed.thermal-data.write, speed.engines.run, speed.audit.read-own]
        - key: speed-process-engineer
          name: SPEED Process Engineer
          description: Enters routes, substances and thermal data, and runs the screening engines.
          permissions: [speed:read, speed.routes.read, speed.routes.write, speed.substances.write, speed.thermal-data.write, speed.engines.run, speed.audit.read-own]
        - key: speed-safety-reviewer
          name: SPEED Safety Reviewer
          description: Reads every route, adds thermal data and reads the whole audit trail.
          permissions: [speed:read, speed.routes.read, speed.thermal-data.write, speed.engines.run, speed.audit.read]
        - key: speed-quality-assurance
          name: SPEED Quality Assurance
          description: Reads every route and the whole audit trail.
          permissions: [speed:read, speed.routes.read, speed.engines.run, speed.audit.read]
        - key: speed-administrator
          name: SPEED Administrator
          description: Reads every route and the audit trail, and manages the module's settings.
          permissions: [speed:read, speed.routes.read, speed.engines.run, speed.audit.read, speed.settings.manage]
  # The live conformance probe (`pnpm module:conformance process-safety-screening --live`) on projects.
  conformance:
    collection: v1/projects
    create: { code: CONFORMANCE-1, name: Conformance probe, siteUnitId: conformance-site }
    update: { reason: Conformance probe, name: Conformance probe renamed }
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/speed]
    catalogKey: process-safety-screening
    audience: gigalibs-process-safety-screening-api
    upstream: process-safety-screening
    signingKeyEnvironment: SPEED_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: SPEED
    routeNoun: SPEED
    serviceName: SPEED Process Safety Screening
    entitlementName: SPEED Process Safety Screening
    # The module SDK's record routes behind the metadata windows (WI-OI-120f).
    records: true
    routes:
      - { path: 'v1/projects', GET: speed.routes.read, POST: speed.routes.write }
      - { path: 'v1/projects/{id}', GET: speed.routes.read, PATCH: speed.routes.write }
      - { path: 'v1/projects/{id}/archive', POST: speed.routes.write }
      - { path: 'v1/criteria-sets', GET: speed.routes.read, POST: speed.settings.manage }
      - { path: 'v1/criteria-sets/{id}', GET: speed.routes.read }
      - { path: 'v1/criteria-sets/{id}/put-in-force', POST: speed.settings.manage }
      - { path: 'v1/library-sets', GET: speed.routes.read, POST: speed.settings.manage }
      - { path: 'v1/library-sets/{id}', GET: speed.routes.read }
      - { path: 'v1/library-sets/{id}/put-in-force', POST: speed.settings.manage }
      - { path: 'v1/substances', GET: speed.routes.read, POST: speed.substances.write }
      - { path: 'v1/substances/{id}', GET: speed.routes.read, PATCH: speed.substances.write }
      - { path: 'v1/substances/{id}/archive', POST: speed.substances.write }
      - { path: 'v1/routes', GET: speed.routes.read, POST: speed.routes.write }
      - { path: 'v1/routes/{id}', GET: speed.routes.read, PATCH: speed.routes.write }
      - { path: 'v1/routes/{id}/archive', POST: speed.routes.write }
      - { path: 'v1/routes/{id}/recompute', POST: speed.engines.run }
      - { path: 'v1/routes/{id}/results', GET: speed.routes.read }
      - { path: 'v1/routes/{id}/steps', POST: speed.routes.write }
      # WI-OI-120ca (S7): dossiers and exports read the route (plan v1.4 §4.4); downloads are hash-checked and audited.
      - { path: 'v1/routes/{id}/dossiers', GET: speed.routes.read, POST: speed.routes.read }
      - { path: 'v1/routes/{id}/export/json|csv', GET: speed.routes.read }
      - { path: 'v1/dossiers/{id}', GET: speed.routes.read }
      - { path: 'v1/dossiers/{id}/files/docx|pdf', GET: speed.routes.read }
      # WI-OI-120cc (S9b): the business outcomes, computed from the member's readable sites.
      - { path: 'v1/outcomes', GET: speed.routes.read }
      # WI-OI-120cc: the audit trail (the service reads all, own or nothing by speed.audit.*); CSV for speed.audit.read.
      - { path: 'v1/audit-events', GET: 'speed:read' }
      - { path: 'v1/audit-events/export/csv', GET: speed.audit.read }
      - { path: 'v1/steps/{id}', PATCH: speed.routes.write }
      - { path: 'v1/steps/{id}/move', POST: speed.routes.write }
      - { path: 'v1/steps/{id}/remove', POST: speed.routes.write }
      - { path: 'v1/steps/{id}/materials', POST: speed.routes.write }
      - { path: 'v1/steps/{id}/conditions', PUT: speed.routes.write }
      - { path: 'v1/steps/{id}/thermal-data', POST: speed.thermal-data.write }
      - { path: 'v1/steps/{id}/mitigation', PUT: speed.routes.write }
      - { path: 'v1/steps/{id}/controls', PUT: speed.routes.write }
      - { path: 'v1/materials/{id}', PATCH: speed.routes.write }
      - { path: 'v1/materials/{id}/remove', POST: speed.routes.write }
      - { path: 'v1/materials/{id}/energetic-groups', PUT: speed.routes.write }
      - { path: 'v1/organization/versions/{id}/units', POST: 'organization:activate' }
      - { path: 'v1/organization/versions/{id}/complete', POST: 'organization:activate' }
