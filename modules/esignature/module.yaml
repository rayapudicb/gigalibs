# E-Signature: envelopes and signatures. Prototype without a registered work item; frozen by the owner on 2026-09-28.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: esignature
  displayName: E-Signature
  version: 0.1.0
  lifecycle: prototype
  workItem: null
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules: []
  capabilities:
    - envelopes
    - signatures
  ui:
    application: apps/workflow-platform
    basePath: /esign
  api:
    application: apps/api
    port: 4500
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_esign
    crossSchemaAccess: false
  catalog:
    - key: esignature
      name: E-Signature
      navigationLabel: Cryptographic Esign Pro
      area: Documents
      navigationGroup: Data & Documents
      route: /esign
      iconKey: file-signature
      readiness: CONTAINED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: esign:read
      platformInspection: true
      reason: Envelope service code with tests. Not running in the local stack; the web still uses a development token. No legal-signature compliance is claimed. Frozen and locked (ADR-0016 F6).
      navigationOrder: 250
      personas: [OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER, CUSTOMER_GUEST]
