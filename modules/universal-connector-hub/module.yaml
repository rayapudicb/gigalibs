apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-connector-hub
  displayName: Universal Enterprise Connector Hub
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-026
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules:
    - workflow-studio
    - universal-data-studio
    - multi-currency
    - universal-rule-pro
    - accounts-receivable
    - spend-management
  capabilities:
    - enterprise-connector-catalog
    - inbound-webhook-ingestion
    - hmac-signature-verification
    - raw-ingestion-journaling
    - idempotency-buffer
    - polling-delta-sync
    - workflow-studio-dispatch
  ui:
    application: apps/workflow-platform
    basePath: /connections
  api:
    application: apps/api
    port: 4100
    # How the web gateway reaches this module (WI-OI-083c); generated into the shell by `pnpm modules:catalog`.
    upstream:
      key: connector-hub
      serviceHostname: connector-hub-api
      environmentKey: CONNECTOR_HUB_API_URL
  storage:
    schema: gigalibs_connectors
    tables:
      - connector_definitions
      - tenant_connections
      - connector_credentials
      - raw_ingestion_journal
      - sync_jobs
      - audit_events
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: connections
      name: Connections
      navigationLabel: Connections & Adapters
      area: Integration
      navigationGroup: Platform
      route: /connections
      iconKey: radio
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: connections:read
      platformInspection: false
      reason: Webhook intake and scheduled pulls into a raw ingestion journal, as a service with tenant isolation. Outbound logins and certified connectors are planned (WI-OI-104). Not certified.
      navigationOrder: 90
    - key: connector-hub
      name: Connector Hub
      navigationLabel: 1-Click OAuth Studio
      area: Integration
      navigationGroup: Platform
      route: /connections/oauth-studio
      iconKey: lock
      readiness: REVIEW
      maturity: UI_PROTOTYPE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: connections:read
      platformInspection: false
      reason: Connection set-up screens. Logins such as OAuth and schema discovery are not implemented yet (WI-OI-104).
      navigationOrder: 180
