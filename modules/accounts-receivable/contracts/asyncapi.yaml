asyncapi: 2.6.0
info:
  title: GigaLibs Accounts Receivable Events
  version: 0.1.0-dev
  description: Development contract for the implemented committed invoice-issued event in WI-OI-019.
x-planned-events:
  - ar.invoice.balance-changed.v1
defaultContentType: application/json
channels:
  ar.invoice.issued.v1:
    publish:
      operationId: publishInvoiceIssued
      message:
        $ref: '#/components/messages/InvoiceIssued'
components:
  messages:
    InvoiceIssued:
      name: ar.invoice.issued.v1
      messageId: eventId
      payload:
        allOf:
          - $ref: '#/components/schemas/EventEnvelope'
          - type: object
            required: [data]
            properties:
              data:
                type: object
                additionalProperties: false
                required: [invoiceId, billingEntityId, invoiceNumber, currency, totalMinor, issuedAt]
                properties:
                  invoiceId: {type: string, format: uuid}
                  billingEntityId: {type: string, format: uuid}
                  invoiceNumber: {type: string}
                  currency: {type: string, pattern: '^[A-Z]{3}$'}
                  totalMinor: {type: integer}
                  issuedAt: {type: string, format: date-time}
  schemas:
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [specversion, id, source, type, tenantId, subject, time, correlationId, data]
      properties:
        specversion: {type: string, const: '1.0'}
        id: {type: string, format: uuid}
        source: {type: string, const: gigalibs.accounts-receivable}
        type: {type: string}
        tenantId: {type: string, format: uuid}
        subject: {type: string}
        time: {type: string, format: date-time}
        correlationId: {type: string}
        causationId: {type: [string, 'null']}
        data: {type: object}
