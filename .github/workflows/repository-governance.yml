name: Repository governance

on:
  pull_request:
  push:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # WI-OI-120ak (S3b): the runtime-data baseline is compared with the base of the change.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Production data audit
        run: node scripts/verify-runtime-data-integrity.mjs
      - name: All active runtime data audit
        run: node scripts/verify-runtime-data-integrity.mjs --all-runtime
      - name: Runtime data baseline adds no new mock (pull request)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/verify-runtime-data-integrity.mjs --all-runtime --baseline-since "origin/$BASE_REF"
      - name: Runtime data baseline adds no new mock (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/verify-runtime-data-integrity.mjs --all-runtime --baseline-since "$BEFORE"
      - name: Migration pin audit
        run: node scripts/verify-migration-pins.mjs
      - name: Package dependency audit
        run: node scripts/verify-package-dependencies.mjs
      - name: API boundary audit
        run: node scripts/verify-api-module-boundary.mjs
      - name: Navigation boundary audit
        run: node scripts/verify-navigation-boundary.mjs
      - name: SDLC governance audit
        run: node scripts/verify-sdlc-governance.mjs
