apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-returns
  displayName: Returns and RMA
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-128
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules: []
  capabilities:
    - universal-returns-records
    - rma-processing-checklist
  ui:
    application: apps/workflow-platform
    basePath: /universal-returns
    package: '@gigalibs/universal-returns-web'
    pages:
      - route: /universal-returns
        component: ReturnsRmaWorkspace
  api:
    application: apps/api
    port: 4790
    upstream:
      key: universal-returns
      serviceHostname: module-host
      environmentKey: UNIVERSAL_RETURNS_API_URL
      basePath: /universal-returns
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_universal_returns
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: universal-returns
      name: Returns and RMA
      navigationLabel: Returns and RMA
      area: Returns and RMA
      navigationGroup: Financial Operations
      route: /universal-returns
      iconKey: boxes
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: universal-returns.rma.read
      personas: [OPERATIONS_SUPERVISOR]
      platformInspection: false
      reason: Generated by module:new. It stays PLANNED until it passes `pnpm module:conformance universal-returns --live` and is reviewed.
      navigationOrder: 350
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/universal-returns]
    catalogKey: universal-returns
    audience: gigalibs-universal-returns-api
    upstream: universal-returns
    signingKeyEnvironment: UNIVERSAL_RETURNS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: UNIVERSAL_RETURNS
    routeNoun: Returns and RMA
    serviceName: Returns and RMA
    entitlementName: Returns and RMA
    routes:
      - { path: 'v1/records', GET: universal-returns.records.read, POST: universal-returns.records.manage }
      - { path: 'v1/records/{id}', GET: universal-returns.records.read, PATCH: universal-returns.records.manage }
      - { path: 'v1/rmas', GET: universal-returns.rma.read, POST: universal-returns.rma.manage }
      - { path: 'v1/rmas/{id}', GET: universal-returns.rma.read }
      - { path: 'v1/rmas/{id}/submit', POST: universal-returns.rma.manage }
      - { path: 'v1/rmas/{id}/authorize', POST: universal-returns.rma.authorize }
      - { path: 'v1/rmas/{id}/dispositions', POST: universal-returns.disposition.manage }
      - { path: 'v1/rmas/{id}/credit-memo-request', POST: universal-returns.rma.manage }
