apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: spend-management
  displayName: Enterprise Spend Management & AP Studio
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-020
spec:
  standalone: true
  requiredModules: []
  optionalModules:
    - accounts-receivable
    - multi-currency
    - tax-configuration
  capabilities:
    - cost-centers
    - expense-reporting
    - corporate-cards
    - travel-desk-gsa
    - imprest-wallets
    - saas-subscriptions
    - approval-matrix
    - spend-analytics
    - outbox-events
    - audit-log
  ui:
    application: apps/workflow-platform
    basePath: /spend
  api:
    application: apps/api
    port: 3500
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_spend
    crossSchemaAccess: false
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: spend-management
      name: Spend Management & AP
      navigationLabel: Spend Management & AP
      area: Finance
      navigationGroup: Financial Operations
      route: /spend
      iconKey: credit-card
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: spend:read
      platformInspection: true
      reason: The bounded spend slice uses PostgreSQL RLS, tenant authority and optimistic locking; disbursement and full reconciliation remain in review.
      navigationOrder: 120
      personas: [C_LEVEL]
