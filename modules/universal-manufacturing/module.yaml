apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-manufacturing
  displayName: Manufacturing & MRP
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-126
spec:
  standalone: true
  category: business
  requiredModules:
    - product-catalogue
    - universal-inventory
  optionalModules: []
  capabilities:
    - universal-manufacturing-records
    - bom-explosion
    - production-orders
    - mrp-netting
  events:
    emits:
      - manufacturing.production.completed.v1
    consumes: []
  ui:
    application: apps/workflow-platform
    basePath: /universal-manufacturing
    package: '@gigalibs/universal-manufacturing-web'
    pages:
      - route: /universal-manufacturing
        component: ManufacturingWorkspace
        props:
          section: home
      - route: /universal-manufacturing/boms
        component: ManufacturingWorkspace
        props:
          section: boms
      - route: /universal-manufacturing/production
        component: ManufacturingWorkspace
        props:
          section: production
      - route: /universal-manufacturing/mrp
        component: ManufacturingWorkspace
        props:
          section: mrp
  api:
    application: apps/api
    port: 4790
    upstream:
      key: universal-manufacturing
      serviceHostname: module-host
      environmentKey: UNIVERSAL_MANUFACTURING_API_URL
      basePath: /universal-manufacturing
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_universal_manufacturing
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: universal-manufacturing
      name: Manufacturing & MRP
      navigationLabel: Manufacturing & MRP
      area: Manufacturing & MRP
      navigationGroup: Workforce & Operations
      route: /universal-manufacturing
      iconKey: factory
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: universal-manufacturing.bom.read
      personas: [OPERATIONS_SUPERVISOR]
      menu:
        - { key: boms, label: BOMs, path: /universal-manufacturing/boms, icon: layers }
        - { key: production, label: Production, path: /universal-manufacturing/production, icon: factory }
        - { key: mrp, label: MRP preview, path: /universal-manufacturing/mrp, icon: bar-chart }
      platformInspection: false
      reason: Generated by module:new. It stays PLANNED until it passes `pnpm module:conformance universal-manufacturing --live` and is reviewed.
      navigationOrder: 340
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/universal-manufacturing]
    catalogKey: universal-manufacturing
    audience: gigalibs-universal-manufacturing-api
    upstream: universal-manufacturing
    signingKeyEnvironment: UNIVERSAL_MANUFACTURING_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: UNIVERSAL_MANUFACTURING
    routeNoun: Manufacturing & MRP
    serviceName: Manufacturing & MRP
    entitlementName: Manufacturing & MRP
    routes:
      - { path: 'v1/records', GET: universal-manufacturing.records.read, POST: universal-manufacturing.records.manage }
      - { path: 'v1/records/{id}', GET: universal-manufacturing.records.read, PATCH: universal-manufacturing.records.manage }
      - { path: 'v1/boms', GET: universal-manufacturing.bom.read, POST: universal-manufacturing.bom.manage }
      - { path: 'v1/boms/{id}/tree', GET: universal-manufacturing.bom.read }
      - { path: 'v1/production-orders', GET: universal-manufacturing.production.read, POST: universal-manufacturing.production.manage }
      - { path: 'v1/production-orders/{id}/release', POST: universal-manufacturing.production.manage }
      - { path: 'v1/production-orders/{id}/issue', POST: universal-manufacturing.production.manage }
      - { path: 'v1/production-orders/{id}/complete', POST: universal-manufacturing.production.manage }
      - { path: 'v1/mrp/preview', POST: universal-manufacturing.mrp.read }
