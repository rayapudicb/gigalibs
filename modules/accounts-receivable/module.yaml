apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: accounts-receivable
  displayName: Customer Invoicing and Accounts Receivable
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-019
spec:
  standalone: true
  requiredModules: []
  optionalModules:
    - ledger
    - subscription-metering
  capabilities:
    - customers
    - invoice-drafts
    - invoice-issue
    - committed-event-delivery
    - audit
  plannedCapabilities:
    - event-billing-summary
    - source-backed-invoice-generation
    - supplemental-invoice-families
    - markup-policies
    - missed-billing-control
    - controlled-rebilling
    - invoice-template-versions
    - configurable-numbering
    - accounting-system-reconciliation
    - document-delivery
    - payments
    - credit-notes
    - collections
    - reconciliation
    - aging
  ui:
    application: apps/web
    basePath: /ar
  api:
    application: apps/api
    version: v1
    openapi: contracts/openapi.yaml
  worker:
    application: apps/worker
  events:
    asyncapi: contracts/asyncapi.yaml
    emits:
      - ar.invoice.issued.v1
    plannedEmits:
      - ar.invoice.balance-changed.v1
    consumes: []
  identity:
    protocol: oidc
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_ar
    crossSchemaAccess: false
  deployment:
    modes:
      - suite
      - customer-cloud
      - self-contained
      - customer-postgresql-schema
    artifacts:
      - ar-web
      - ar-api
      - ar-worker
      - ar-migrations
  health:
    liveness: /health/live
    readiness: /health/ready
  commercialMeter:
    owner: subscription-metering
    usageEvent: ar.invoice.issued.v1
    dimension: issued_invoices
    idempotencyField: invoiceId
  certification:
    status: not-certified
    evidence: release/evidence-index.yaml
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: accounts-receivable
      name: Accounts Receivable
      navigationLabel: Accounts Receivable
      area: Finance
      navigationGroup: Financial Operations
      route: /ar
      iconKey: arrow-left-right
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: ar:read
      platformInspection: true
      reason: A bounded PostgreSQL-backed customer, draft and issuance journey is available for controlled local UAT; the complete customer-to-cash outcome remains in review.
      navigationOrder: 110
