apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gigalibs-ar.fullname" . }}-api
  labels:
    {{- include "gigalibs-ar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels: {app.kubernetes.io/name: {{ include "gigalibs-ar.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: {{ include "gigalibs-ar.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
    spec:
      serviceAccountName: {{ include "gigalibs-ar.serviceAccount" . }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: {{ include "gigalibs-ar.image" (dict "Values" .Values "component" "api") }}
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          ports: [{name: http, containerPort: 3400}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: AR_API_HOST, value: 0.0.0.0}
            - {name: AR_API_PORT, value: "3400"}
            - {name: AR_CORS_ORIGINS, value: {{ required "web.externalUrl is required" .Values.web.externalUrl | quote }}}
            - name: AR_DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.database.secretName }}, key: {{ .Values.database.apiUrlKey }}}}
            - {name: AR_DATABASE_POOL_SIZE, value: {{ .Values.database.poolSize | quote }}}
            - {name: AR_OIDC_ISSUER, value: {{ required "oidc.issuer is required" .Values.oidc.issuer | quote }}}
            - {name: AR_OIDC_AUDIENCE, value: {{ .Values.oidc.audience | quote }}}
            - {name: AR_OIDC_JWKS_URI, value: {{ required "oidc.jwksUri is required" .Values.oidc.jwksUri | quote }}}
            - {name: AR_OIDC_ALGORITHMS, value: {{ .Values.oidc.algorithms | quote }}}
            - {name: AR_OIDC_TENANT_CLAIM, value: {{ .Values.oidc.tenantClaim | quote }}}
            - {name: AR_OIDC_PERMISSIONS_CLAIM, value: {{ .Values.oidc.permissionsClaim | quote }}}
            - {name: AR_ALLOW_INSECURE_OIDC, value: "false"}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, initialDelaySeconds: 5, timeoutSeconds: 3}
          livenessProbe: {httpGet: {path: /health/live, port: http}, initialDelaySeconds: 10, timeoutSeconds: 3}
          resources: {{ toYaml .Values.resources.api | nindent 12 }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]
      nodeSelector: {{ toYaml .Values.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.tolerations | nindent 8 }}
      affinity: {{ toYaml .Values.affinity | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gigalibs-ar.fullname" . }}-api
  labels:
    {{- include "gigalibs-ar.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: {{ include "gigalibs-ar.name" . }}, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: api}
  ports: [{name: http, port: 3400, targetPort: http}]
