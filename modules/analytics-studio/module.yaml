# Analytics Studio (WI-OI-064): signed context, operational fact store, place rollups and governed metric, industry and country catalogues.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: analytics-studio
  displayName: Analytics Studio
  version: 0.1.0
  lifecycle: implementation
  workItem: WI-OI-064
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules:
    - geospatial
    - universal-connector-hub
  capabilities:
    - metrics
    - datasets
    - query-engine
    - place-rollups
    - lineage
    - reports
    - ingestion
    - schema-discovery
  ui:
    application: apps/workflow-platform
    basePath: /analytics
  api:
    application: apps/api
    port: 4400
    # How the web gateway reaches this module (WI-OI-083c); generated into the shell by `pnpm modules:catalog`.
    upstream:
      key: analytics
      serviceHostname: analytics-api
      environmentKey: ANALYTICS_API_URL
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_analytics
    crossSchemaAccess: false
  catalog:
    - key: analytics-studio
      name: Analytics Studio
      navigationLabel: Universal Analytics Studio
      area: Intelligence
      navigationGroup: Intelligence
      route: /analytics
      iconKey: bar-chart
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: analytics:read
      platformInspection: true
      reason: Runs as a service with PostgreSQL metric facts, place roll-ups and lineage. Explore answers questions by dimension, time and filter, with formula measures, saved chart views, dashboards and CSV reports (WI-OI-103). Not certified.
      navigationOrder: 210
      menu:
        - key: overview
          label: Overview
          path: /analytics
          icon: bar-chart
        - key: places
          label: Places
          path: /analytics/places
          icon: map-pin
        - key: explore
          label: Explore
          path: /analytics/explore
          icon: layers
        - key: dashboards
          label: Dashboards
          path: /analytics/dashboards
          icon: gauge
        - key: reports
          label: Reports
          path: /analytics/reports
          icon: file-text
      # Default roles (ADR-0016 F16, WI-OI-103e): every tenant entitled to Analytics gets these as built-in roles.
      # Tenant admins keep analytics:* through their base role. Measures a steward writes are published by a second
      # person (maker-checker), so a tenant needs two stewards, or a steward and an admin, to publish a formula.
      roles:
        - key: analytics-viewer
          name: Analytics viewer
          description: Views Analytics dashboards, saved charts, places and Explore.
          permissions: [analytics:read]
        - key: analytics-analyst
          name: Analytics analyst
          description: Builds charts, dashboards and reports from published models.
          permissions: [analytics:read, analytics:charts:write, analytics:dashboards:write, analytics:reports:write]
        - key: analytics-data-steward
          name: Analytics data steward
          description: Connects sources, maps fields and defines and publishes measures.
          permissions:
            - analytics:read
            - analytics:connectors:write
            - analytics:mappings:write
            - analytics:models:write
            - analytics:models:publish
      personas: [C_LEVEL]
