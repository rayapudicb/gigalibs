            publicKeyBase64: { type: string, minLength: 40, maxLength: 1000 }
            payloadSha256: { $ref: '#/components/schemas/Checksum' }
            valueBase64: { type: string, minLength: 40, maxLength: 1000 }
    ConfigurationPackageImportResponse:
      type: object
      additionalProperties: false
      required: [packageId, importedChangeSets]
      properties:
        packageId: { type: string, format: uuid }
        importedChangeSets:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/ConfigurationChangeSetResponse' }
    RuntimeManifestResponse:
      type: object
      additionalProperties: false
      required: [activationId, publishedVersionId, activatedAt, manifest, checksum]
      properties:
        activationId: { $ref: '#/components/schemas/Id' }
        publishedVersionId: { $ref: '#/components/schemas/Id' }
        activatedAt: { type: string, format: date-time }
        manifest: { $ref: './configuration-manifest.schema.json' }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
    RuntimeScopeResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, environmentKey, cohortKey, policyKey, entitlementModuleKey, resolutionSource]
      properties:
        contractVersion: { const: '1.0' }
        environmentKey: { $ref: '#/components/schemas/Key' }
        cohortKey: { $ref: '#/components/schemas/Key' }
        policyKey: { const: ALL_ENTITLED_USERS_V1 }
        entitlementModuleKey: { $ref: '#/components/schemas/Key' }
        resolutionSource: { const: SERVER_POLICY }
    RuntimeAdapterResponse:
      type: object
      additionalProperties: false
      required: [adapterKey, descriptorVersion]
      properties:
        adapterKey: { $ref: '#/components/schemas/Key' }
        descriptorVersion: { const: '1.0' }
    CurrentRuntimeManifestResponse:
      type: object
      additionalProperties: false
      required: [activationId, publishedVersionId, activatedAt, manifest, checksum, scope, adapter]
      properties:
        activationId: { $ref: '#/components/schemas/Id' }
        publishedVersionId: { $ref: '#/components/schemas/Id' }
        activatedAt: { type: string, format: date-time }
        manifest: { $ref: './configuration-manifest.schema.json' }
        checksum: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        scope: { $ref: '#/components/schemas/RuntimeScopeResponse' }
        adapter: { $ref: '#/components/schemas/RuntimeAdapterResponse' }
    RuntimeErrorResponse:
      type: object
      additionalProperties: false
      required: [contractVersion, code, message, retryable]
      properties:
        contractVersion: { const: '1.0' }
        code:
          enum:
            - CONFIGURATION_ADAPTER_NOT_FOUND
            - CONFIGURATION_ADAPTER_INCOMPATIBLE
            - CONFIGURATION_RUNTIME_SCOPE_MISSING
            - CONFIGURATION_RUNTIME_SCOPE_DENIED
            - CONFIGURATION_MANIFEST_UNAVAILABLE
        message: { type: string, minLength: 1, maxLength: 240 }
        retryable: { type: boolean }
    Problem:
      type: object
      additionalProperties: true
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        code: { type: string }
        message: { type: string }
  responses:
    SurfaceList:
      description: Registered code-owned and tenant-application surfaces
      content:
        application/json:
          schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ConfigurationSurfaceResponse' } }
    ChangeSet:
      description: Versioned Configuration Studio change set
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationChangeSetResponse' } } }
    ChangeSetList:
      description: Bounded tenant change-set list
      content:
        application/json:
          schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ConfigurationChangeSetResponse' } }
    ImpactReport:
      description: Persisted-record compatibility and activation report
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationImpactReportResponse' } } }
    PublishedVersion:
      description: Immutable published configuration version
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationPublishedVersionResponse' } } }
    PublishedVersionList:
      description: Bounded tenant published-version list
      content:
        application/json:
          schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ConfigurationPublishedVersionResponse' } }
    Activation:
      description: Configuration activation result
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationActivationResponse' } } }
    ActivationList:
      description: Bounded tenant activation list with published-version identity
      content:
        application/json:
          schema: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/ConfigurationActivationListItemResponse' } }
    ExtensionValue:
      description: Permission-filtered extension values, or null when no values exist
      content:
        application/json:
          schema:
            anyOf:
              - { $ref: '#/components/schemas/ConfigurationExtensionValueResponse' }
              - { type: 'null' }
    PackageEnvelope:
      description: Signed definition-only configuration package
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationPackageEnvelopeResponse' } } }
    PackageImport:
      description: Imported package identity and validated draft change sets
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationPackageImportResponse' } } }
    RuntimeApplicationList:
      description: Permission-filtered active tenant applications
      content:
        application/json:
          schema: { type: array, maxItems: 500, items: { $ref: '#/components/schemas/ConfigurationRuntimeApplicationResponse' } }
    RecordList:
      description: Permission-filtered application record page
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationRecordListResponse' } } }
    RecordMutation:
      description: Created, updated or soft-deleted application record
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationRecordMutationResponse' } } }
    RecordDetail:
      description: Permission-filtered application record and active manifest
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationRecordDetailResponse' } } }
    TemplateList:
      description: Permission-filtered template list and active manifest
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationTemplateListResponse' } } }
    Template:
      description: Created or duplicated application template
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationTemplateResponse' } } }
    TemplateUpdate:
      description: Optimistic template update identity
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationTemplateUpdateResponse' } } }
    DeletedResource:
      description: Soft-deleted resource identity
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationDeletedResourceResponse' } } }
    SavedFilterList:
      description: Bounded tenant saved-filter list
      content:
        application/json:
          schema: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/ConfigurationSavedFilterResponse' } }
    SavedFilter:
      description: Created saved filter
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationSavedFilterResponse' } } }
    DeletedSavedFilter:
      description: Deleted saved-filter identity
      content: { application/json: { schema: { $ref: '#/components/schemas/ConfigurationDeletedSavedFilterResponse' } } }
    RuntimeForbidden:
      description: The authenticated tenant or principal is not entitled to the resolved runtime scope
      content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeErrorResponse' } } }
    RuntimeNotFound:
      description: The exact adapter or active runtime manifest is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeErrorResponse' } } }
    RuntimeUnavailable:
      description: Required server runtime policy or an authoritative dependency is unavailable
      content: { application/json: { schema: { $ref: '#/components/schemas/RuntimeErrorResponse' } } }
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Unauthorized: { description: Authentication required, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Forbidden: { description: Permission denied, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    NotFound: { description: Resource not found, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    Conflict: { description: Optimistic concurrency or lifecycle conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Problem' } } } }
    DatabaseUnavailable:
      description: Authoritative PostgreSQL persistence is temporarily unavailable
      headers:
        Retry-After: { schema: { type: integer, const: 1 } }
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [statusCode, code, message]
            properties:
              statusCode: { type: integer, const: 503 }
              code: { type: string, const: DATABASE_TEMPORARILY_UNAVAILABLE }
              message: { type: string, const: 'The service is temporarily unavailable. Retry the request.' }
