apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: safety-operations
  displayName: Safety Operations
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-141
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules: []
  capabilities:
    - safety-operations-records
    - safety-operations-hazard-reports
  # WI-OI-141 M-INC: the Safety Operations workspace (stop work, triage, reports, insights, report a hazard).
  ui:
    basePath: /safety-operations
    package: '@gigalibs/safety-operations-web'
    pages:
      - route: /safety-operations
        component: SafetyWorkspace
        sessionPermissions: true
  api:
    application: apps/api
    port: 4790
    upstream:
      key: safety-operations
      serviceHostname: module-host
      environmentKey: SAFETY_OPERATIONS_API_URL
      basePath: /safety-operations
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_safety_operations
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events, hazard_photos, stop_work_acknowledgements]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: safety-operations
      name: Safety Operations
      navigationLabel: Safety Operations
      area: Safety Operations
      navigationGroup: Workforce & Operations
      route: /safety-operations
      iconKey: shield-alert
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: safety-operations.hazards.report
      platformInspection: false
      reason: Generated by module:new. It stays PLANNED until it passes `pnpm module:conformance safety-operations --live` and is reviewed.
      navigationOrder: 380
      personas: [OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER]
      # WI-OI-141 (ADR-0036): frontline workers report; champions triage and investigate; the EHS director lifts stop work.
      roles:
        - key: safety-frontline-worker
          name: Frontline worker (safety)
          description: Reports hazards, near misses and stop-work events, and follows their own reports.
          permissions: [safety-operations.hazards.report]
        - key: safety-champion
          name: Area safety champion
          description: Reports and triages hazards, acknowledges stop-work alerts and works on investigations.
          permissions: [safety-operations.hazards.report, safety-operations.hazards.read, safety-operations.hazards.triage, safety-operations.stop-work.acknowledge, safety-operations.investigations.manage]
        - key: safety-ehs-director
          name: EHS director
          description: Everything a champion does, and lifts stop-work alerts once the area is safe.
          permissions: [safety-operations.hazards.report, safety-operations.hazards.read, safety-operations.hazards.triage, safety-operations.stop-work.acknowledge, safety-operations.stop-work.lift, safety-operations.investigations.manage]
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/safety-operations]
    catalogKey: safety-operations
    audience: gigalibs-safety-operations-api
    upstream: safety-operations
    signingKeyEnvironment: SAFETY_OPERATIONS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: SAFETY_OPERATIONS
    routeNoun: Safety Operations
    serviceName: Safety Operations
    entitlementName: Safety Operations
    routes:
      - { path: 'v1/records', GET: safety-operations.records.read, POST: safety-operations.records.manage }
      - { path: 'v1/records/{id}', GET: safety-operations.records.read, PATCH: safety-operations.records.manage }
      - { path: 'v1/hazards', GET: safety-operations.hazards.read, POST: safety-operations.hazards.report }
      - { path: 'v1/hazards/mine', GET: safety-operations.hazards.report }
      - { path: 'v1/hazards/insights', GET: safety-operations.hazards.read }
      - { path: 'v1/hazards/{id}', GET: safety-operations.hazards.report }
      - { path: 'v1/hazards/{id}/photo', GET: safety-operations.hazards.report }
      - { path: 'v1/hazards/{id}/triage|close', POST: safety-operations.hazards.triage }
      - { path: 'v1/hazards/{id}/investigation', POST: safety-operations.investigations.manage }
      - { path: 'v1/stop-work', GET: safety-operations.hazards.report }
      - { path: 'v1/stop-work/{id}/acknowledge', POST: safety-operations.stop-work.acknowledge }
      - { path: 'v1/stop-work/{id}/lift', POST: safety-operations.stop-work.lift }
