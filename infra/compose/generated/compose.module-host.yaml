# Generated by `pnpm modules:catalog` from `spec.runtime.hosting: host` in modules/*/module.yaml (WI-OI-085e).
# Do not edit. Render with compose.yaml and infra/compose/.env, .env.modules, .env.module.host and each
# .env.module.<name>. One process runs every hosted module; each keeps its own schema, role, key and migrations.
services:
  business-partners-migrations:
    image: ${MODULE_HOST_IMAGE:?MODULE_HOST_IMAGE is required}
    pull_policy: never
    command: ["run-module-migrations.mjs"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${MODULE_MIGRATIONS_DATABASE_URL:?MODULE_MIGRATIONS_DATABASE_URL is required}
      MODULE_RUNTIME_DATABASE_URL: ${BUSINESS_PARTNERS_DATABASE_URL:?BUSINESS_PARTNERS_DATABASE_URL is required}
      MODULE_MIGRATIONS_DIRECTORY: /app/modules/business-partners/migrations
      MODULE_SCHEMA: gigalibs_business_partners
      MODULE_EXPECTED_MIGRATION_VERSION: "6"
      MODULE_APPEND_ONLY_TABLES: audit_events,credit_status
      MODULE_READ_ONLY_TABLES: auth_revocation_events
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.gigalibs.profile-key: module-runtime-local-development-v1
      com.gigalibs.execution-class: LOCAL_DEVELOPMENT
      com.gigalibs.release-id: ${RELEASE_ID:?RELEASE_ID is required}
      org.opencontainers.image.revision: ${SOURCE_REVISION:?SOURCE_REVISION is required}
      com.gigalibs.source-state-sha256: ${SOURCE_STATE_SHA256:?SOURCE_STATE_SHA256 is required}

