apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: financial-operations
  displayName: Financial Operations & General Ledger
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-094
spec:
  standalone: true
  category: business
  requiredModules: [accounts-receivable, universal-procurement, universal-orders, universal-inventory]
  optionalModules: [universal-connector-hub, analytics-studio, tax-configuration, multi-currency]
  capabilities:
    - accounting-books
    - chart-of-accounts
    - fiscal-periods
    - double-entry-journal
    - subledger-ap-ingestion
    - subledger-ar-ingestion
    - subledger-inventory-ingestion
    - trial-balance
    - balance-sheet
    - income-statement
    - immutable-reversals
    - outbox-events
    - audit
    - treasury-bank-accounts
    - bank-statement-ingestion
    - bank-reconciliation
    - fixed-assets-depreciation
    - multi-company-consolidation
    - inventory-costing-valuation
    - landed-cost-allocation
    - cogs-accounting
    - budgeting-planning
    - commitment-accounting
    - budget-variance-control
    - period-close-orchestration
    - subledger-lockout
    - accruals-deferrals-amortization
    - year-end-close-rollover
    - financial-forecasting
    - financial-health-analytics
    - statement-drill-through
  ui:
    basePath: /finance
    package: '@gigalibs/financial-operations-web'
    pages:
      # WI-OI-120g (owner-approved 2026-10-05): the mock-up screen is taken down until U12 to U18 lands its windows.
      - route: /finance
        unavailable:
          title: Finance screens are not connected yet
          summary: The Financial Operations service runs in this instance (books, chart of accounts, periods, journals, treasury, bank reconciliation, fixed assets, consolidation, costing, budgeting and close), but its screens are being rebuilt as metadata windows over that service (U12 to U18). The previous screen showed sample books, banks and balances, so it has been taken down rather than let anyone record its numbers as results.
          availableForTesting:
            - Stock movements that will post to the ledger, at /inventory.
          blockedActions:
            - Showing sample ledgers, balances or reports as financial facts.
            - Buttons that look like actions but do nothing.
  api:
    application: apps/api
    port: 4790
    upstream:
      key: financial-operations
      serviceHostname: module-host
      environmentKey: FINANCIAL_OPERATIONS_API_URL
      basePath: /financial-operations
    version: v1
  events:
    emits:
      - finance.journal.posted.v1
      - finance.journal.reversed.v1
      - finance.period.locked.v1
      - finance.bank.statement.imported.v1
      - finance.bank.reconciliation.sealed.v1
      - finance.asset.capitalized.v1
      - finance.depreciation.run.posted.v1
      - finance.asset.disposed.v1
      - finance.consolidation.group.created.v1
      - finance.consolidation.run.executed.v1
      - finance.consolidation.run.sealed.v1
      - finance.costing.profile.created.v1
      - finance.costing.layer.created.v1
      - finance.costing.cogs.posted.v1
      - finance.costing.landed_cost.posted.v1
      - finance.costing.revaluation.posted.v1
      - finance.budget.structure.created.v1
      - finance.budget.revision.activated.v1
      - finance.budget.commitment.recorded.v1
      - finance.budget.threshold.exceeded.v1
      - finance.subledger_lock.updated.v1
      - finance.close_checklist.updated.v1
      - finance.amortization_schedule.created.v1
      - finance.amortization_line.posted.v1
      - finance.year_end_close.executed.v1
      - finance.forecast.generated.v1
    consumes:
      - ar.invoice.issued.v1
      - orders.fulfillment.dispatched.v1
      - inventory.receipt.completed.v1
      - inventory.stock.issued.v1
      - platform.authorization.revoked.v1
      - platform.organization.version.v1
  identity:
    protocol: signed-platform-context-v1
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_finance
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: financial-operations
      name: Financial Operations & General Ledger
      navigationLabel: General Ledger & Finance
      area: Financial Operations
      navigationGroup: Financial Operations
      route: /finance
      iconKey: scale
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: finance:read
      platformInspection: true
      reason: The module boundary is implemented under WI-OI-094 and remains PLANNED until live module conformance and independent review are recorded.
      navigationOrder: 132
      personas: [OPERATIONS_SUPERVISOR]
      roles:
        - key: chief-accountant
          name: Chief Accountant
          description: Oversees chart of accounts, fiscal periods, posted journals, immutable reversals, and financial reporting.
          permissions: [finance:read, 'finance:books:manage', 'finance:coa:manage', 'finance:periods:manage', 'finance:journals:manage', 'finance:journals:post', 'finance:journals:reverse', 'finance:reports:view']
        - key: financial-analyst
          name: Financial Analyst
          description: Analyzes trial balance, balance sheet, and income statement facts across fiscal periods.
          permissions: [finance:read, 'finance:reports:view']
        - key: staff-accountant
          name: Staff Accountant
          description: Enters and reviews double-entry general ledger journals and operational distributions.
          permissions: [finance:read, 'finance:journals:manage', 'finance:reports:view']
  gateway:
    basePaths: [/api/financial-operations]
    catalogKey: financial-operations
    audience: gigalibs-financial-operations-api
    upstream: financial-operations
    signingKeyEnvironment: FINANCIAL_OPERATIONS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: FINANCIAL_OPERATIONS
    routeNoun: Financial Operations
    serviceName: Financial Operations & General Ledger
    entitlementName: Financial Operations
    routes:
      - { path: 'v1/books', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/books/{id}', GET: finance:read }
      - { path: 'v1/accounts', GET: finance:read, POST: 'finance:coa:manage' }
      - { path: 'v1/accounts/{id}', GET: finance:read, PUT: 'finance:coa:manage' }
      - { path: 'v1/fiscal-years', GET: finance:read, POST: 'finance:periods:manage' }
      - { path: 'v1/fiscal-periods', GET: finance:read }
      - { path: 'v1/fiscal-periods/{id}/status', PUT: 'finance:periods:manage' }
      - { path: 'v1/journals', GET: finance:read, POST: 'finance:journals:post' }
      - { path: 'v1/journals/{id}', GET: finance:read }
      - { path: 'v1/journals/{id}/reverse', POST: 'finance:journals:reverse' }
      - { path: 'v1/reports/trial-balance', GET: 'finance:reports:view' }
      - { path: 'v1/reports/balance-sheet', GET: 'finance:reports:view' }
      - { path: 'v1/reports/income-statement', GET: 'finance:reports:view' }
      - { path: 'v1/treasury/bank-accounts', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/treasury/bank-accounts/{id}', GET: finance:read }
      - { path: 'v1/treasury/bank-statements', GET: finance:read }
      - { path: 'v1/treasury/bank-statements/import', POST: 'finance:journals:manage' }
      - { path: 'v1/treasury/bank-statements/{id}', GET: finance:read }
      - { path: 'v1/treasury/reconciliations/sessions', GET: finance:read, POST: 'finance:journals:manage' }
      - { path: 'v1/treasury/reconciliations/auto-match', POST: 'finance:journals:manage' }
      - { path: 'v1/treasury/reconciliations/manual-match', POST: 'finance:journals:manage' }
      - { path: 'v1/treasury/reconciliations/matches/{id}', DELETE: 'finance:journals:manage' }
      - { path: 'v1/treasury/reconciliations/fee-adjustments', POST: 'finance:journals:post' }
      - { path: 'v1/treasury/reconciliations/seal', POST: 'finance:journals:post' }
      - { path: 'v1/treasury/reconciliations/{id}/report', GET: 'finance:reports:view' }
      - { path: 'v1/fixed-assets/asset-classes', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/fixed-assets/asset-classes/{id}', GET: finance:read }
      - { path: 'v1/fixed-assets/assets', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/fixed-assets/assets/{id}', GET: finance:read }
      - { path: 'v1/fixed-assets/assets/{id}/capitalize', POST: 'finance:journals:post' }
      - { path: 'v1/fixed-assets/assets/{id}/schedules', GET: finance:read }
      - { path: 'v1/fixed-assets/depreciation-runs', POST: 'finance:journals:post' }
      - { path: 'v1/fixed-assets/assets/{id}/dispose', POST: 'finance:journals:post' }
      - { path: 'v1/consolidation/groups', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/consolidation/groups/{id}', GET: finance:read }
      - { path: 'v1/consolidation/groups/{id}/entities', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/consolidation/groups/{id}/fx-rates', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/consolidation/groups/{id}/intercompany-pairs', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/consolidation/runs', POST: 'finance:journals:post' }
      - { path: 'v1/consolidation/runs/{id}', GET: finance:read }
      - { path: 'v1/consolidation/runs/{id}/seal', POST: 'finance:journals:post' }
      - { path: 'v1/consolidation/runs/{id}/statement', GET: 'finance:reports:view' }
      - { path: 'v1/costing/profiles', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/costing/profiles/{id}', GET: finance:read }
      - { path: 'v1/costing/receipt-layers', POST: 'finance:journals:manage' }
      - { path: 'v1/costing/shipments', POST: 'finance:journals:manage' }
      - { path: 'v1/costing/landed-costs', POST: 'finance:journals:manage' }
      - { path: 'v1/costing/revaluations', POST: 'finance:journals:manage' }
      - { path: 'v1/costing/valuation-summary', GET: 'finance:reports:view' }
      - { path: 'v1/budgeting/structures', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/budgeting/structures/{id}', GET: finance:read }
      - { path: 'v1/budgeting/revisions', POST: 'finance:books:manage' }
      - { path: 'v1/budgeting/revisions/{id}', GET: finance:read }
      - { path: 'v1/budgeting/revisions/{id}/submit', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/revisions/{id}/approve', POST: 'finance:journals:post' }
      - { path: 'v1/budgeting/revisions/{id}/activate', POST: 'finance:journals:post' }
      - { path: 'v1/budgeting/revisions/{id}/freeze', POST: 'finance:journals:post' }
      - { path: 'v1/budgeting/lines', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/distribute-annual', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/check-availability', POST: finance:read }
      - { path: 'v1/budgeting/commitments', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/commitments/liquidate', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/commitments/release', POST: 'finance:journals:manage' }
      - { path: 'v1/budgeting/revisions/{id}/variance', GET: 'finance:reports:view' }
      - { path: 'v1/close/subledgers', GET: finance:read }
      - { path: 'v1/close/subledgers/lock', POST: 'finance:periods:manage' }
      - { path: 'v1/close/checklists', GET: finance:read }
      - { path: 'v1/close/checklists/tasks', POST: 'finance:periods:manage' }
      - { path: 'v1/close/amortization/schedules', GET: finance:read, POST: 'finance:journals:manage' }
      - { path: 'v1/close/amortization/schedules/{id}/lines', GET: finance:read }
      - { path: 'v1/close/amortization/lines/execute', POST: 'finance:journals:post' }
      - { path: 'v1/close/year-end/preview', POST: finance:read }
      - { path: 'v1/close/year-end/execute', POST: 'finance:periods:manage' }
      - { path: 'v1/close/forecasting/models', GET: finance:read, POST: 'finance:books:manage' }
      - { path: 'v1/close/forecasting/models/{id}/lines', GET: finance:read }
      - { path: 'v1/close/forecasting/generate', POST: 'finance:journals:manage' }
      - { path: 'v1/close/financial-health', GET: 'finance:reports:view' }
      - { path: 'v1/close/drill-through', POST: 'finance:reports:view' }
