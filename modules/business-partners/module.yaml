apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: business-partners
  displayName: Universal Business Partner
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-123
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules: []
  capabilities:
    - business-partners-records
  events:
    emits:
      - partner.credit-hold.v1
    consumes:
      - platform.organization.version.v1
      - party.created.v1
      - party.updated.v1
      - party.archived.v1
      - party.merged.v1
      - party.role.changed.v1
      - ar.credit.invoice-balance.v1
      - orders.credit.uninvoiced-balance.v1
      - procurement.credit.vendor-bill-balance.v1
  # Pages: the Partners metadata window (dictionary/partners.window.json) over the SDK record routes. The generic
  # records placeholder posted to v1/records, which the module stopped serving when its record dispatcher arrived.
  # The generated page is a server component, so it imports the client component's own entry, not the package index
  # (whose hooks modules carry no 'use client').
  ui:
    basePath: /business-partners
    package: '@gigalibs/configuration-react/module-window'
    pages:
      - route: /business-partners
        component: ModuleWindowWorkspace
        sessionPermissions: true
        props:
          moduleKey: business-partners
          entityKey: partners
          surfaceKey: partners
          basePath: /api/business-partners
          title: Business partners
          description: Partners, accounts and credit. Partners are created in the platform's party records.
  api:
    application: apps/api
    port: 4790
    upstream:
      key: business-partners
      serviceHostname: module-host
      environmentKey: BUSINESS_PARTNERS_API_URL
      basePath: /business-partners
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_business_partners
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events, credit_status]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: business-partners
      name: Universal Business Partner
      navigationLabel: Business partners
      area: Universal Business Partner
      navigationGroup: Financial Operations
      route: /business-partners
      iconKey: building
      readiness: PLANNED
      maturity: CONCEPT
      entitlementEligible: true
      trialEligible: false
      requiredPermission: business-partners.records.read
      platformInspection: false
      reason: Credit exposure, holds, netting, AR/Orders feeds and signed credit-check gateway; partner windows on metadata.
      navigationOrder: 330
      personas: [OPERATIONS_SUPERVISOR]
      roles:
        - key: partner-manager
          name: Partner Manager
          description: Manages business partners, their accounts, credit limits and holds.
          permissions: ['business-partners:read', 'business-partners:write', business-partners.records.read, business-partners.records.manage, business-partners.accounts.read, business-partners.accounts.manage, business-partners.credit.read, business-partners.credit.manage]
        - key: partner-viewer
          name: Partner Viewer
          description: Reads business partners, their accounts and credit status.
          permissions: ['business-partners:read', business-partners.records.read, business-partners.accounts.read, business-partners.credit.read]
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/business-partners]
    catalogKey: business-partners
    audience: gigalibs-business-partners-api
    upstream: business-partners
    signingKeyEnvironment: BUSINESS_PARTNERS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: BUSINESS_PARTNERS
    routeNoun: Universal Business Partner
    serviceName: Universal Business Partner
    entitlementName: Universal Business Partner
    # The module SDK's record routes (v1/records/{entity}..., v1/lookups/{key}) for the Partners window.
    records: true
    routes:
      - { path: 'v1/partners/{id}/accounts', GET: business-partners.accounts.read }
      - { path: 'v1/partners/{id}/customer-accounts', POST: business-partners.accounts.manage, PATCH: business-partners.accounts.manage }
      - { path: 'v1/partners/{id}/vendor-accounts', POST: business-partners.accounts.manage }
      - { path: 'v1/partners/{id}/credit-holds', GET: business-partners.credit.read, POST: business-partners.credit.manage }
      - { path: 'v1/partners/{id}/credit-holds/{id}/release', POST: business-partners.credit.manage }
      - { path: 'v1/partners/{id}/credit-status', GET: business-partners.credit.read }
      - { path: 'v1/partners/{id}/credit-status/explain', GET: business-partners.credit.read }
      - { path: 'v1/partners/{id}/bank-accounts', GET: business-partners.accounts.read, POST: business-partners.accounts.manage }
      - { path: 'v1/partners/{id}/netting', GET: business-partners.credit.read }
      - { path: 'v1/credit-check', POST: business-partners.credit.read }
  # WI-OI-152 (ADR-0037 §3): the masters this module keeps, listed in the Master data area.
  masters:
    - { label: Customers and vendors, group: partners, route: /business-partners, records: business-partners.partners }
