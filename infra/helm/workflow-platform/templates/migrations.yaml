apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "workflow-platform.fullname" . }}-migrations-{{ .Release.Revision }}
  labels:
    {{- include "workflow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "workflow-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      serviceAccountName: {{ include "workflow-platform.serviceAccount" . }}
      restartPolicy: Never
      containers:
        - name: migrations
          image: {{ include "workflow-platform.image" (dict "Values" .Values "Chart" .Chart "component" "migrations") }}
          imagePullPolicy: {{ .Values.images.migrations.pullPolicy }}
          command: ["pnpm", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.urlKey }}
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
