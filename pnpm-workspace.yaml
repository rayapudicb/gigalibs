packages:
  - "packages/*"
  - "packages/integrations/*"
  - "apps/*"
  - "e2e"
  - "modules/*/domain"
  - "modules/*/web"
  - "modules/*/apps/*"
  - "!modules/communications-textfly/apps/admin-console"
  - "!modules/communications-textfly/apps/agent-runtime"
  - "!modules/communications-textfly/apps/embed-demo-host"
allowBuilds:
  '@biomejs/biome': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

overrides:
  "@prisma/config@6.19.3>deepmerge-ts": "8.0.2"
  "@nestjs/platform-express@11.2.3>multer": "2.4.0"
  "next@15.5.24>postcss": "8.5.28"
