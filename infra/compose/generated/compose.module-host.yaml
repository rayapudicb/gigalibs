      FINANCIAL_OPERATIONS_EXPECTED_MIGRATION_VERSION: "5"
      FINANCIAL_OPERATIONS_PLATFORM_CONTEXT_AUDIENCE: gigalibs-financial-operations-api
      FINANCIAL_OPERATIONS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${FINANCIAL_OPERATIONS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?FINANCIAL_OPERATIONS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      PRODUCT_CATALOGUE_DATABASE_URL: ${PRODUCT_CATALOGUE_DATABASE_URL:?PRODUCT_CATALOGUE_DATABASE_URL is required}
      PRODUCT_CATALOGUE_DATABASE_POOL_SIZE: "5"
      PRODUCT_CATALOGUE_EXPECTED_MIGRATION_VERSION: "1"
      PRODUCT_CATALOGUE_PLATFORM_CONTEXT_AUDIENCE: gigalibs-product-catalogue-api
      PRODUCT_CATALOGUE_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${PRODUCT_CATALOGUE_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?PRODUCT_CATALOGUE_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      UNIVERSAL_INVENTORY_DATABASE_URL: ${UNIVERSAL_INVENTORY_DATABASE_URL:?UNIVERSAL_INVENTORY_DATABASE_URL is required}
      UNIVERSAL_INVENTORY_DATABASE_POOL_SIZE: "5"
      UNIVERSAL_INVENTORY_EXPECTED_MIGRATION_VERSION: "2"
      UNIVERSAL_INVENTORY_PLATFORM_CONTEXT_AUDIENCE: gigalibs-universal-inventory-api
      UNIVERSAL_INVENTORY_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${UNIVERSAL_INVENTORY_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?UNIVERSAL_INVENTORY_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      UNIVERSAL_ORDERS_DATABASE_URL: ${UNIVERSAL_ORDERS_DATABASE_URL:?UNIVERSAL_ORDERS_DATABASE_URL is required}
