      - "host.docker.internal:host-gateway"
    depends_on:
      financial-operations-migrations:
        condition: service_completed_successfully
      product-catalogue-migrations:
        condition: service_completed_successfully
      universal-inventory-migrations:
        condition: service_completed_successfully
      universal-orders-migrations:
        condition: service_completed_successfully
      universal-procurement-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4790/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      com.gigalibs.profile-key: module-runtime-local-development-v1
      com.gigalibs.execution-class: LOCAL_DEVELOPMENT
      com.gigalibs.release-id: ${RELEASE_ID:?RELEASE_ID is required}
      org.opencontainers.image.revision: ${SOURCE_REVISION:?SOURCE_REVISION is required}
      com.gigalibs.source-state-sha256: ${SOURCE_STATE_SHA256:?SOURCE_STATE_SHA256 is required}

