openapi: 3.1.0
info:
  title: GigaLibs Configuration Studio API
  version: 1.0.0
  description: >-
    Implemented WI-OI-039 control-plane contract. Tenant and actor scope are derived from the
    authenticated session; idempotency keys and optimistic versions are carried in request bodies.
servers:
  - url: /api/v1/configuration
security:
  - sessionBearer: []
tags:
  - name: Registry
  - name: Change sets
  - name: Activation
  - name: Runtime
  - name: Applications
  - name: Packages
paths:
  /surfaces:
    get:
      tags: [Registry]
      operationId: listConfigurationSurfaces
      responses:
        '200': { $ref: '#/components/responses/SurfaceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets:
    get:
      tags: [Change sets]
      operationId: listConfigurationChangeSets
      responses:
        '200': { $ref: '#/components/responses/ChangeSetList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Change sets]
      operationId: createConfigurationChangeSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateChangeSetRequest' }
      responses:
        '201': { $ref: '#/components/responses/ChangeSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [Change sets]
      operationId: updateConfigurationChangeSet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateChangeSetRequest' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}/impact:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Change sets]
      operationId: getConfigurationChangeSetImpact
      responses:
        '200': { $ref: '#/components/responses/ImpactReport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}/submit:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Change sets]
      operationId: submitConfigurationChangeSet
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Change sets]
      operationId: approveConfigurationChangeSet
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}/reject:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Change sets]
      operationId: rejectConfigurationChangeSet
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/ChangeSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /change-sets/{id}/publish:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Change sets]
      operationId: publishConfigurationChangeSet
      requestBody: { $ref: '#/components/requestBodies/Reason' }
      responses:
        '200': { $ref: '#/components/responses/PublishedVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /published-versions:
    get:
      tags: [Change sets]
      operationId: listConfigurationPublishedVersions
      responses:
        '200': { $ref: '#/components/responses/PublishedVersionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /activations:
    get:
      tags: [Activation]
      operationId: listConfigurationActivations
      responses:
        '200': { $ref: '#/components/responses/ActivationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Activation]
      operationId: activateConfigurationVersion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Activation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /activations/rollback:
    post:
      tags: [Activation]
      operationId: rollbackConfigurationActivation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivationRequest' }
      responses:
        '201': { $ref: '#/components/responses/Activation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /runtime/manifest:
    get:
      tags: [Runtime]
      operationId: getConfigurationRuntimeManifest
      deprecated: true
      x-gigalibs-deprecation:
        status: compatibility-only
        deprecatedSince: '2026-09-24'
        sunset: not-scheduled
        removalCriteria: >-
          Removal requires zero measured legacy consumers for at least 30 consecutive days in an
          authorized release environment and a separately reviewed and accepted compatibility change.
      description: >-
        Compatibility route. environmentKey and cohortKey are optional client assertions only;
        the server rejects mismatches before cache or database access.
      parameters:
        - $ref: '#/components/parameters/ModuleKeyQuery'
        - $ref: '#/components/parameters/EntityKeyQuery'
        - $ref: '#/components/parameters/SurfaceKeyQuery'
        - $ref: '#/components/parameters/EnvironmentKeyQuery'
        - $ref: '#/components/parameters/CohortKeyQuery'
      responses:
        '200':
          description: Permission-filtered active manifest and activation identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeManifestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /runtime/manifest/current:
    get:
      tags: [Runtime]
      operationId: getCurrentConfigurationRuntimeManifest
      description: Resolves environment, cohort and durable module entitlement on the server.
      parameters:
        - $ref: '#/components/parameters/ModuleKeyQuery'
        - $ref: '#/components/parameters/EntityKeyQuery'
        - $ref: '#/components/parameters/SurfaceKeyQuery'
      responses:
        '200':
          description: Permission-filtered manifest with server-resolved scope and adapter identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentRuntimeManifestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RuntimeForbidden' }
        '404': { $ref: '#/components/responses/RuntimeNotFound' }
        '503': { $ref: '#/components/responses/RuntimeUnavailable' }
  /runtime/manifest/preview:
    get:
      tags: [Runtime]
      operationId: previewConfigurationRuntimeManifest
      description: >-
        Audited administrative preview requiring configuration-runtime:read and
        configuration:read. Preview never creates normal cohort membership.
      parameters:
        - $ref: '#/components/parameters/ModuleKeyQuery'
        - $ref: '#/components/parameters/EntityKeyQuery'
        - $ref: '#/components/parameters/SurfaceKeyQuery'
        - $ref: '#/components/parameters/EnvironmentKeyRequiredQuery'
        - $ref: '#/components/parameters/CohortKeyRequiredQuery'
      responses:
        '200':
          description: Permission-filtered preview manifest and activation identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeManifestResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/RuntimeForbidden' }
        '404': { $ref: '#/components/responses/RuntimeNotFound' }
        '503': { $ref: '#/components/responses/RuntimeUnavailable' }
  /extension-values/{ownerType}/{ownerId}:
    parameters:
      - $ref: '#/components/parameters/OwnerType'
      - $ref: '#/components/parameters/OwnerId'
    get:
      tags: [Runtime]
      operationId: getConfigurationExtensionValues
      responses:
        '200': { $ref: '#/components/responses/ExtensionValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Runtime]
      operationId: saveConfigurationExtensionValues
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExtensionValuesRequest' }
      responses:
        '200': { $ref: '#/components/responses/ExtensionValue' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /packages/export:
    post:
      tags: [Packages]
      operationId: exportConfigurationPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ExportPackageRequest' }
      responses:
        '200': { $ref: '#/components/responses/PackageEnvelope' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /packages/import:
    post:
      tags: [Packages]
      operationId: importConfigurationPackage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportPackageRequest' }
      responses:
        '201': { $ref: '#/components/responses/PackageImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps:
    get:
      tags: [Applications]
      operationId: listRuntimeApplications
      responses:
        '200': { $ref: '#/components/responses/RuntimeApplicationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/records:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
    get:
      tags: [Applications]
      operationId: listConfigurationApplicationRecords
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/SortKey'
        - $ref: '#/components/parameters/SortDirection'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/FilterKey'
        - $ref: '#/components/parameters/FilterValue'
      responses:
        '200': { $ref: '#/components/responses/RecordList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Applications]
      operationId: createConfigurationApplicationRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRecordRequest' }
      responses:
        '201': { $ref: '#/components/responses/RecordMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/records/{recordId}:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Applications]
      operationId: getConfigurationApplicationRecord
      responses:
        '200': { $ref: '#/components/responses/RecordDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    patch:
      tags: [Applications]
      operationId: updateConfigurationApplicationRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRecordRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecordMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    delete:
      tags: [Applications]
      operationId: deleteConfigurationApplicationRecord
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteRecordRequest' }
      responses:
        '200': { $ref: '#/components/responses/RecordMutation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/templates:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
    get:
      tags: [Applications]
      operationId: listConfigurationTemplates
      responses:
        '200': { $ref: '#/components/responses/TemplateList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Applications]
      operationId: createConfigurationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/templates/{templateId}:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
      - $ref: '#/components/parameters/TemplateId'
    put:
      tags: [Applications]
      operationId: updateConfigurationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTemplateRequest' }
      responses:
        '200': { $ref: '#/components/responses/TemplateUpdate' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    delete:
      tags: [Applications]
      operationId: deleteConfigurationTemplate
      responses:
        '200': { $ref: '#/components/responses/DeletedResource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/templates/{templateId}/duplicate:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
      - $ref: '#/components/parameters/TemplateId'
    post:
      tags: [Applications]
      operationId: duplicateConfigurationTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateTemplateRequest' }
      responses:
        '201': { $ref: '#/components/responses/Template' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/saved-filters:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
    get:
      tags: [Applications]
      operationId: listConfigurationSavedFilters
      responses:
        '200': { $ref: '#/components/responses/SavedFilterList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
    post:
      tags: [Applications]
      operationId: createConfigurationSavedFilter
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSavedFilterRequest' }
      responses:
        '201': { $ref: '#/components/responses/SavedFilter' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
  /apps/{entityKey}/saved-filters/{filterId}:
    parameters:
      - $ref: '#/components/parameters/EntityKeyPath'
      - $ref: '#/components/parameters/FilterId'
    delete:
      tags: [Applications]
      operationId: deleteConfigurationSavedFilter
      responses:
        '200': { $ref: '#/components/responses/DeletedSavedFilter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/DatabaseUnavailable' }
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Server-validated session; tenant and permissions are resolved from authoritative persistence.
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    OwnerType: { name: ownerType, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    OwnerId: { name: ownerId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    EntityKeyPath: { name: entityKey, in: path, required: true, schema: { $ref: '#/components/schemas/Key' } }
    RecordId: { name: recordId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TemplateId: { name: templateId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    FilterId: { name: filterId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    ModuleKeyQuery: { name: moduleKey, in: query, required: true, schema: { $ref: '#/components/schemas/Key' } }
    EntityKeyQuery: { name: entityKey, in: query, required: true, schema: { $ref: '#/components/schemas/Key' } }
    SurfaceKeyQuery: { name: surfaceKey, in: query, required: true, schema: { $ref: '#/components/schemas/Key' } }
    EnvironmentKeyQuery: { name: environmentKey, in: query, schema: { $ref: '#/components/schemas/Key' }, description: Optional assertion checked against server policy. }
    CohortKeyQuery: { name: cohortKey, in: query, schema: { $ref: '#/components/schemas/Key' }, description: Optional assertion checked against server policy. }
    EnvironmentKeyRequiredQuery: { name: environmentKey, in: query, required: true, schema: { $ref: '#/components/schemas/Key' } }
    CohortKeyRequiredQuery: { name: cohortKey, in: query, required: true, schema: { $ref: '#/components/schemas/Key' } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 500 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    SortKey: { name: sortKey, in: query, schema: { type: string, maxLength: 80 } }
    SortDirection: { name: sortDirection, in: query, schema: { enum: [ASC, DESC], default: DESC } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 200 } }
    FilterKey: { name: filterKey, in: query, schema: { type: string, maxLength: 80 } }
    FilterValue: { name: filterValue, in: query, schema: { type: string, maxLength: 500 } }
  requestBodies:
    Reason:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReasonRequest' }
  schemas:
    Id: { type: string, minLength: 1, maxLength: 200 }
    Key: { type: string, minLength: 2, maxLength: 80, pattern: '^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$' }
    Reason: { type: string, minLength: 3, maxLength: 500 }
    IdempotencyKey: { type: string, minLength: 8, maxLength: 200 }
    Values: { type: object, additionalProperties: true }
    ConfigurationDefinition:
      type: object
      additionalProperties: false
      required: [contractVersion, moduleKey, entityKey, surfaceKey, mode, title, fields, sections]
      properties:
        contractVersion: { const: '1.0' }
        moduleKey: { $ref: '#/components/schemas/Key' }
        entityKey: { $ref: '#/components/schemas/Key' }
        surfaceKey: { $ref: '#/components/schemas/Key' }
        mode: { enum: [CREATE, EDIT, READ, LIST] }
        title: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        fields:
          type: array
          maxItems: 250
