apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: physical-operations-cmms
  displayName: Asset & Maintenance (CMMS)
  version: 0.2.0-dev
  lifecycle: implementation
  # WI-OI-038 (roadmap P4) owns the CMMS core. The earlier WI-OI-031 reference was the solution-pack item.
  workItem: WI-OI-038
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules:
    - geospatial
  # Mounted in the canonical runtime (signed context, least-privilege RLS, db/runtime-manifest.txt).
  capabilities:
    - asset-registry
    - asset-hierarchy
    - work-orders
    - preventive-maintenance
    - meter-readings
    - parts-inventory
    - stock-ledger
    - maintenance-overview
    - cafm-spaces
    - audit-log
    - outbox-events
  # Contained until their own work items: CMMS-local people and dispatch (Workforce owns people, P6 handshake
  # WI-OI-068), requests/vendors/procurement (CM-06), IoT ingress and meter automation (CM-04), automatic PM
  # generation (CM-05), downtime and reliability reporting (CM-07), import/export (frozen under WI-OI-043).
  containedCapabilities:
    - people-and-dispatch
    - maintenance-requests
    - vendors-customers
    - purchase-orders
    - iot-ingress
    - automatic-pm-generation
    - import-export
  ui:
    application: apps/workflow-platform
    basePath: /cmms
    # Pages (WI-OI-083b): generated into the web shell by `pnpm modules:catalog`; screens come from `package`.
    package: '@gigalibs/cmms-web'
    pages:
      - route: /cmms
        component: CmmsWorkspace
        props:
          section: overview
      - route: /cmms/work-orders
        component: CmmsWorkspace
        props:
          section: work-orders
      - route: /cmms/assets
        component: CmmsWorkspace
        props:
          section: assets
      - route: /cmms/schedules
        component: CmmsWorkspace
        props:
          section: schedules
      - route: /cmms/meters
        component: CmmsWorkspace
        props:
          section: meters
      # WI-OI-134 M-CAL: instrument calibration (standards, profiles, records, approval, certificates).
      - route: /cmms/calibration
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: calibration
      # WI-OI-135 M-TAG: field commissioning triage, physical tags and floor-walk audits.
      - route: /cmms/commissioning
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: commissioning
      # WI-OI-136 M-BOM: exploded diagrams with live stock and part reservations.
      - route: /cmms/spares
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: spares
      # WI-OI-138 M-SOP: visual maintenance work instructions (authoring, four-eyes approval, guided execution).
      - route: /cmms/sop
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: sop
      # WI-OI-139 M-DVIR: fleet readiness, red tags, enrolment, check templates and inspection history.
      - route: /cmms/fleet
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: fleet
      # WI-OI-140 M-REQ: QR request links (labels, revocation) and the requests raised through them.
      - route: /cmms/request-links
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: request-links
      # WI-OI-142 M-LOTO: permits, isolation board and isolation procedure library.
      - route: /cmms/permits
        component: CmmsWorkspace
        sessionPermissions: true
        props:
          section: permits
      - route: /cmms/inventory
        component: CmmsWorkspace
        props:
          section: inventory
      - route: /cmms/spaces
        component: CmmsWorkspace
        props:
          section: spaces
      - route: /cmms/requests
        component: CmmsWorkspace
        props:
          section: requests
        # A metadata window: the renderer gets the signed-in user's permissions (WI-OI-120e).
        sessionPermissions: true
      - route: /cmms/classifications
        component: CmmsWorkspace
        props:
          section: classifications
        # A metadata window: the renderer gets the signed-in user's permissions (WI-OI-120e).
        sessionPermissions: true
      - route: /cmms/requests/portal
        unavailable:
          title: Maintenance request portal is not connected
          summary: The portal is contained because no production request-intake endpoint currently persists and routes these submissions.
          blockedActions:
            - Submitting contact or maintenance issue data.
            - Claiming dispatch, supervisor receipt, or technician assignment.
      - route: /cmms/purchase-orders
        unavailable:
          title: CMMS purchase orders are not connected
          summary: Procurement actions are contained until an authenticated purchase-order service, approval policy, goods receipt, and reconciliation path are implemented.
          blockedActions:
            - Creating or approving purchase orders.
            - Claiming inventory replenishment without a persisted goods receipt.
      - route: /cmms/vendors
        unavailable:
          title: CMMS vendors are not connected
          summary: The supplier screen is contained until a tenant-scoped vendor service and authoritative rating provenance are implemented.
          blockedActions:
            - Creating supplier records from this screen.
            - Showing inferred vendor ratings or default commercial rates.
      - route: /cmms/people
        unavailable:
          title: CMMS people and teams are not connected
          summary: The CMMS screen is contained until it reads and writes the canonical workforce resources, capabilities, and allocations APIs.
          availableForTesting:
            - Canonical workforce APIs remain available through authenticated integration tests.
          blockedActions:
            - Creating technicians or teams from a separate CMMS-local people model.
            - Displaying default roles, rates, or utilization as customer facts.
      - route: /cmms/workload
        unavailable:
          title: CMMS workforce workload is moving to GigaOps Workforce
          summary: CMMS will publish maintenance demand and consume tenant-bound GigaOps Workforce bookings. Capacity and utilization will not be calculated from a duplicate CMMS technician model.
          availableForTesting:
            - The CMMS-to-Workforce ownership boundary and containment state.
          blockedActions:
            - Dispatching or reallocating people through the legacy CMMS-local workforce model.
            - Displaying sample capacity or utilization as customer facts.
      - route: /cmms/floor
        unavailable:
          title: Shop-floor kiosk is not connected
          summary: The kiosk view needs device identity and live meter alerts, which arrive with automatic work orders from meter readings. Technicians use the work-order screen to execute work.
          availableForTesting:
            - Work-order execution at /cmms/work-orders.
          blockedActions:
            - Displaying simulated sensor alerts or line status as live facts.
      - route: /cmms/calendar
        unavailable:
          title: CMMS workforce calendar is moving to GigaOps Workforce
          summary: CMMS continues to own maintenance work orders and required skills. Scheduling people against that demand will be provided by the canonical GigaOps Workforce booking service after WI-OI-060 certification.
          availableForTesting:
            - CMMS maintenance work orders remain separate from workforce identity and booking ownership.
          blockedActions:
            - Scheduling technicians through the legacy CMMS-local workforce model.
            - Presenting unpersisted calendar allocations as tenant records.
      - route: /cmms/analytics
        component: CmmsModuleAnalytics
        sessionPermissions: true
  api:
    application: apps/api
    port: 4200
    # How the web gateway reaches this module (WI-OI-083c); generated into the shell by `pnpm modules:catalog`.
    upstream:
      key: cmms
      serviceHostname: cmms-api
      environmentKey: CMMS_API_URL
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_cmms
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: asset-maintenance
      name: Asset & Maintenance (CMMS)
      navigationLabel: Asset maintenance
      area: Physical Operations
      navigationGroup: Workforce & Operations
      route: /cmms
      iconKey: factory
      readiness: REVIEW
      maturity: INTEGRATED_CANDIDATE
      entitlementEligible: true
      trialEligible: true
      requiredPermission: cmms:read
      platformInspection: true
      reason: Assets, work orders, preventive maintenance, meters and parts run as a service with tenant isolation and live checks. IoT and deeper EAM are planned. Not certified.
      navigationOrder: 220
      # WI-OI-120n: read-only people (Viewer, e.g. an auditor holding Maintenance viewer) see CMMS too; the
      # permission still decides.
      personas: [OPERATIONS_SUPERVISOR, WORKFORCE_MEMBER, CUSTOMER_GUEST]
      menu:
        # WI-OI-145: one plain name per screen, the same in the sidebar, the breadcrumb and the page title; Overview
        # added; the in-page section bar is gone; Floor Kiosk (not connected yet) is off the menu, its page stays.
        - { key: overview, label: Overview, path: /cmms, icon: gauge }
        - { key: requests, label: Requests, path: /cmms/requests, icon: file-text }
        - { key: work-orders, label: Work orders, path: /cmms/work-orders, icon: wrench }
        - { key: assets, label: Assets, path: /cmms/assets, icon: factory }
        - { key: spaces, label: Spaces, path: /cmms/spaces, icon: building }
        - { key: classifications, label: Classifications, path: /cmms/classifications, icon: layers }
        - { key: schedules, label: Preventive maintenance, path: /cmms/schedules, icon: clock }
        - { key: inventory, label: Parts, path: /cmms/inventory, icon: boxes }
        - { key: meters, label: Meters, path: /cmms/meters, icon: gauge }
        - { key: calibration, label: Calibration, path: /cmms/calibration, icon: shield-check, permissions: [cmms.calibration.read] }
        - { key: commissioning, label: Commissioning, path: /cmms/commissioning, icon: map-pin, permissions: [cmms.commissioning.read] }
        - { key: spares, label: Visual spares, path: /cmms/spares, icon: layers, permissions: [cmms.bom.read] }
        - { key: sop, label: Work instructions, path: /cmms/sop, icon: file-check, permissions: [cmms.sop.read] }
        - { key: fleet, label: Fleet readiness, path: /cmms/fleet, icon: gauge, permissions: [cmms.fleet.read] }
        - { key: request-links, label: QR request links, path: /cmms/request-links, icon: scan-line, permissions: [cmms.portal.manage] }
        - { key: permits, label: Permits & LOTO, path: /cmms/permits, icon: lock, permissions: [cmms.permits.read] }
        - { key: analytics, label: Reliability, path: /cmms/analytics, icon: bar-chart, permissions: [cmms.analytics.read, analytics:read] }
      # WI-OI-120n (owner, 2026-10-06): module roles, copied into a workspace when CMMS is switched on and assigned on
      # Settings -> Team, so maintenance access goes to the people who maintain and not to every Member. Each carries
      # the Workforce and site permissions its job needs, because a person holds one custom role today.
      roles:
        - key: maintenance-technician
          name: Maintenance technician
          # WI-OI-120be (owner decision D1a, 2026-10-16): technicians keep cmms.work-orders.write in this release, as on
          # UAT before it: the work-order screen and REST API still require it. Narrowing them to their own work orders
          # (cmms.work-orders.execute-own only, WI-OI-120t) comes with the work-order window.
          description: Carries out work orders, records meter readings and labour, and punches their own time.
          permissions: [cmms:read, cmms.work-orders.read, cmms.work-orders.write, cmms.work-orders.execute-own, cmms.requests.read, cmms.requests.create, cmms.assets.read, cmms.meters.read, cmms.meters.write, cmms.pm.read, cmms.parts.read, cmms.calibration.read, cmms.calibration.execute, cmms.commissioning.read, cmms.commissioning.submit, cmms.audits.read, cmms.audits.execute, cmms.bom.read, cmms.parts.reserve, cmms.sop.read, cmms.sop.execute, cmms.fleet.read, cmms.fleet.inspect, cmms.fleet.certify, cmms.requests.report, cmms.permits.read, cmms.permits.request, cmms.permits.lock, maps.nodes.read, workforce:read, workforce.resources.read, workforce.jobs.read, workforce.time.punch]
        - key: maintenance-planner
          name: Maintenance planner
          description: Plans, assigns and closes work; manages assets, preventive schedules and parts; manages people and approves time and absence for everyone in the workspace (not only the maintenance team) until roles are held per unit (ADR-0034). Linking logins stays with administrators.
          permissions: [cmms:read, cmms.work-orders.read, cmms.work-orders.write, cmms.work-orders.execute-own, cmms.requests.read, cmms.requests.create, cmms.requests.write, cmms.assets.read, cmms.assets.write, cmms.meters.read, cmms.meters.write, cmms.pm.read, cmms.pm.write, cmms.parts.read, cmms.parts.write, cmms.analytics.read, cmms.calibration.read, cmms.calibration.manage, cmms.commissioning.read, cmms.commissioning.approve, cmms.audits.read, cmms.bom.read, cmms.bom.manage, cmms.bom.publish, cmms.parts.reserve, cmms.sop.read, cmms.sop.execute, cmms.sop.author, cmms.sop.approve, cmms.fleet.read, cmms.fleet.inspect, cmms.fleet.authorize, cmms.fleet.manage, cmms.portal.manage, cmms.requests.report, cmms.permits.read, cmms.isolations.manage, maps:read, maps.nodes.read, workforce:read, workforce.resources.read, workforce.resources.manage, workforce.jobs.read, workforce.jobs.manage, workforce.bookings.read, workforce.bookings.manage, workforce.availability.read, workforce.availability.manage, workforce.time.read, workforce.time.punch, workforce.timesheets.approve, workforce.absences.read, workforce.absences.request, workforce.absences.approve]
        - key: maintenance-viewer
          name: Maintenance viewer
          description: Reads assets, work orders, schedules, meters, parts and reliability figures without changing them, and raises and follows their own maintenance requests.
          permissions: [cmms:read, cmms.work-orders.read, cmms.requests.read, cmms.requests.create, cmms.assets.read, cmms.meters.read, cmms.pm.read, cmms.parts.read, cmms.analytics.read, cmms.calibration.read, cmms.commissioning.read, cmms.audits.read, cmms.bom.read, cmms.sop.read, cmms.fleet.read, cmms.requests.report, cmms.permits.read, maps.nodes.read]
        # WI-OI-134 M-CAL: approves calibrations and publishes instrument profiles (never their own: four eyes).
        - key: metrology-lead
          name: Metrology lead
          description: Keeps master standards and instrument calibration profiles, publishes profiles others drafted, and approves or rejects calibrations others performed.
          permissions: [cmms:read, cmms.assets.read, cmms.work-orders.read, cmms.calibration.read, cmms.calibration.manage, cmms.calibration.publish, cmms.calibration.approve, cmms.sop.read, cmms.sop.approve, maps.nodes.read]
        # WI-OI-142 M-LOTO: the issuer authorizes permits and keeps the isolation procedures; the area lead countersigns.
        - key: permit-issuer
          name: Permit issuer
          description: Witnesses zero-energy checks, authorizes permits others requested, closes them after de-isolation, and keeps isolation procedures others publish.
          permissions: [cmms:read, cmms.assets.read, cmms.work-orders.read, cmms.permits.read, cmms.permits.authorize, cmms.isolations.manage, maps.nodes.read]
        - key: area-operations-lead
          name: Area operations lead
          description: Countersigns permits the issuer authorized, so work in their area can start.
          permissions: [cmms:read, cmms.assets.read, cmms.work-orders.read, cmms.permits.read, cmms.permits.countersign, maps.nodes.read]
        # WI-OI-139 M-DVIR: drivers and equipment operators run circle checks and red-tag unsafe equipment.
        - key: equipment-operator
          name: Equipment operator
          description: Inspects forklifts, cranes and vehicles before and after use, and red-tags equipment with a critical safety defect.
          permissions: [cmms:read, cmms.assets.read, cmms.fleet.read, cmms.fleet.inspect, cmms.requests.report, cmms.permits.read, cmms.permits.lock, maps.nodes.read]
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  # Templates: `{id}` is an identifier; `a|b` is one of several segment values. Generated by `pnpm modules:catalog`.
  gateway:
    basePaths: [/api/cmms]
    catalogKey: asset-maintenance
    audience: gigalibs-cmms-api
    upstream: cmms
    signingKeyEnvironment: CMMS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: CMMS
    routeNoun: CMMS
    serviceName: Asset & Maintenance
    entitlementName: Asset & Maintenance
    # WI-OI-120t (M-CM1): the module SDK's record routes for metadata windows and lookups.
    records: true
    # Contained 2026-09-28 (WI-OI-083 security finding, owner-approved): these answer "unavailable" to a signed-in
    # tenant user (503, no business action) until rebuilt through the module API with RBAC (WI-OI-083d moved them
    # from hand-written shell routes).
    unavailable:
      - { path: 'work-orders/{id}/financials', methods: [GET] }
      - { path: 'work-orders/{id}/labour-link', methods: [POST] }
      - { path: 'work-orders/{id}/settle', methods: [POST] }
    routes:
      - { path: 'v1/spaces/tree', GET: cmms.assets.read }
      - { path: 'v1/spaces/{id}', GET: cmms.assets.read, PATCH: cmms.assets.write, DELETE: cmms.assets.write }
      - { path: 'v1/spaces/{id}/assets', GET: cmms.assets.read }
      - { path: 'v1/spaces/{id}/cad-layers', POST: cmms.assets.write }
      - { path: 'v1/spaces', POST: cmms.assets.write }
      - { path: 'v1/assets/search', POST: cmms.assets.read }
      - { path: 'v1/assets/{id}', GET: cmms.assets.read, PATCH: cmms.assets.write }
      - { path: 'v1/assets', POST: cmms.assets.write }
      - { path: 'v1/assets/{id}/archive', POST: cmms.assets.write }
      - { path: 'v1/assets/{id}/downtime', GET: cmms.assets.read }
      - { path: 'v1/assets/{id}/downtime/start', POST: cmms.assets.write }
      - { path: 'v1/assets/{id}/downtime/end', POST: cmms.assets.write }
      - { path: 'v1/requests/search', POST: cmms.requests.read }
      - { path: 'v1/requests/{id}', GET: cmms.requests.read }
      - { path: 'v1/requests', POST: cmms.requests.create }
      - { path: 'v1/requests/{id}/triage', POST: cmms.requests.write }
      - { path: 'v1/requests/{id}/cancel', POST: cmms.requests.create }
      - { path: 'v1/work-orders/search', POST: cmms.work-orders.read }
      - { path: 'v1/work-orders/{id}', GET: cmms.work-orders.read, PATCH: cmms.work-orders.write }
      - { path: 'v1/work-orders/{id}/history', GET: cmms.work-orders.read }
      - { path: 'v1/work-orders', POST: cmms.work-orders.write }
      # WI-OI-120be (W1 reviews; 120aj finding W2): executing work (status, tasks, labour, parts, notes) takes write or
      # execute-own; requesting crew from Workforce is planning, so staffing takes write only, as staffing/cancel does.
      - { path: 'v1/work-orders/{id}/sign-off', POST: cmms.work-orders.write }
      - { path: 'v1/work-orders/{id}/status|tasks|labour|parts|notes', POST: [cmms.work-orders.write, cmms.work-orders.execute-own] }
      - { path: 'v1/work-orders/{id}/staffing', POST: cmms.work-orders.write }
      - { path: 'v1/work-orders/{id}/staffing/cancel', POST: cmms.work-orders.write }
      - { path: 'v1/work-orders/{id}/tasks/{id}', PATCH: [cmms.work-orders.write, cmms.work-orders.execute-own] }
      - { path: 'v1/pm-schedules', GET: cmms.pm.read, POST: cmms.pm.write }
      - { path: 'v1/pm-schedules/{id}', GET: cmms.pm.read, PATCH: cmms.pm.write }
      - { path: 'v1/pm-schedules/{id}/generate', POST: cmms.pm.write }
      - { path: 'v1/meters', GET: cmms.meters.read, POST: cmms.meters.write }
      - { path: 'v1/meters/{id}', GET: cmms.meters.read }
      - { path: 'v1/meters/{id}/readings', GET: cmms.meters.read, POST: cmms.meters.write }
      - { path: 'v1/parts/search', POST: cmms.parts.read }
      - { path: 'v1/parts/{id}', GET: cmms.parts.read, PATCH: cmms.parts.write }
      - { path: 'v1/parts/{id}/movements', GET: cmms.parts.read, POST: cmms.parts.write }
      - { path: 'v1/parts', POST: cmms.parts.write }
      - { path: 'v1/analytics/work-orders/overview', GET: cmms.analytics.read }
      - { path: 'v1/analytics/inventory/summary', GET: cmms.analytics.read }
      # WI-OI-120h (U19a): the routes the CMMS screens call that the API already served (WI-EAM-002 to WI-EAM-005).
      - { path: 'v1/classifications/tree', GET: cmms.assets.read }
      - { path: 'v1/classifications', POST: cmms.assets.write }
      - { path: 'v1/classifications/{id}', GET: cmms.assets.read, PATCH: cmms.assets.write, DELETE: cmms.assets.write }
      - { path: 'v1/classifications/{id}/spec-definitions', GET: cmms.assets.read }
      - { path: 'v1/classifications/spec-definitions', POST: cmms.assets.write }
      - { path: 'v1/assets/{id}/specs', GET: cmms.assets.read, PUT: cmms.assets.write }
      - { path: 'v1/assets/{id}/equipment-tree', GET: cmms.assets.read }
      - { path: 'v1/assets/{id}/cascade-status', POST: cmms.assets.write }
      - { path: 'v1/meters/telemetry/batch', POST: cmms.meters.write }
      - { path: 'v1/meters/triggers', GET: cmms.meters.read, POST: cmms.meters.write }
      - { path: 'v1/meters/triggers/{id}', PATCH: cmms.meters.write, DELETE: cmms.meters.write }
      - { path: 'v1/calibration/standards', GET: cmms.calibration.read, POST: cmms.calibration.manage }
      - { path: 'v1/calibration/standards/{id}', PATCH: cmms.calibration.manage }
      - { path: 'v1/calibration/profiles', GET: cmms.calibration.read, POST: cmms.calibration.manage }
      - { path: 'v1/calibration/profiles/{id}', PATCH: cmms.calibration.manage }
      - { path: 'v1/calibration/profiles/{id}/publish', POST: cmms.calibration.publish }
      - { path: 'v1/calibration/instruments', GET: cmms.calibration.read }
      - { path: 'v1/calibration/instruments/{id}/bundle|drift', GET: cmms.calibration.read }
      - { path: 'v1/calibration/records', GET: cmms.calibration.read, POST: cmms.calibration.execute }
      - { path: 'v1/calibration/records/{id}', GET: cmms.calibration.read }
      - { path: 'v1/calibration/records/{id}/decision', POST: cmms.calibration.approve }
      - { path: 'v1/calibration/records/{id}/certificate', GET: cmms.calibration.read }
      - { path: 'v1/commissioning/context', GET: cmms.commissioning.read }
      - { path: 'v1/commissioning/requests', GET: cmms.commissioning.read, POST: cmms.commissioning.submit }
      - { path: 'v1/commissioning/requests/{id}', GET: cmms.commissioning.read }
      - { path: 'v1/commissioning/requests/{id}/decision', POST: cmms.commissioning.approve }
      - { path: 'v1/asset-tags/resolve', GET: cmms.assets.read }
      - { path: 'v1/asset-tags/{id}/retire', POST: cmms.assets.write }
      - { path: 'v1/assets/{id}/tags', GET: cmms.assets.read, POST: cmms.assets.write }
      - { path: 'v1/asset-audits', GET: cmms.audits.read, POST: cmms.audits.execute }
      - { path: 'v1/asset-audits/{id}/sightings|finish', POST: cmms.audits.execute }
      - { path: 'v1/asset-audits/{id}/report', GET: cmms.audits.read }
      - { path: 'v1/assets/{id}/diagrams', GET: cmms.bom.read, POST: cmms.bom.manage }
      - { path: 'v1/assets/{id}/open-work-orders', GET: cmms.work-orders.read }
      - { path: 'v1/diagrams/{id}', GET: cmms.bom.read, PATCH: cmms.bom.manage }
      - { path: 'v1/diagrams/{id}/hotspots', PUT: cmms.bom.manage }
      - { path: 'v1/diagrams/{id}/revise', POST: cmms.bom.manage }
      - { path: 'v1/diagrams/{id}/publish', POST: cmms.bom.publish }
      - { path: 'v1/diagrams/{id}/image|consumption', GET: cmms.bom.read }
      - { path: 'v1/part-reservations', POST: cmms.parts.reserve }
      # WI-OI-140: managers' request-link routes only; v1/portal/context|requests|status are reached by the control
      # plane's portal adapter alone and are deliberately absent here.
      - { path: 'v1/portal/links', GET: cmms.portal.manage, POST: cmms.portal.manage }
      - { path: 'v1/portal/links/{id}/revoke', POST: cmms.portal.manage }
      - { path: 'v1/portal/submissions', GET: cmms.portal.manage }
