apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: operator-rounds
  displayName: Operator Inspection Rounds
  version: 0.1.0-dev
  lifecycle: implementation
  # Generated by `pnpm module:new` (WI-OI-085). Register a work item before the module leaves PLANNED.
  workItem: WI-OI-133
spec:
  standalone: true
  category: business
  requiredModules:
    - physical-operations-cmms
    - gigaops
  optionalModules:
    - iot-gateway
    - analytics-studio
  capabilities:
    - operator-rounds-routes
    - operator-rounds-offline-execution
    - operator-rounds-exceptions
  events:
    emits:
      - operator-rounds.facts.v1
      - operator-rounds.cmms.v1
    consumes:
      - platform.organization.version.v1
  ui:
    basePath: /operator-rounds
    package: '@gigalibs/operator-rounds-web'
    pages:
      - route: /operator-rounds
        component: RoundsWorkspace
        sessionPermissions: true
  api:
    application: apps/api
    port: 4790
    upstream:
      key: operator-rounds
      serviceHostname: module-host
      environmentKey: OPERATOR_ROUNDS_API_URL
      basePath: /operator-rounds
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_operator_rounds
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  # host: runs inside the shared module host (product vision §8, WI-OI-085e); service: its own image and service.
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
    optionalEnvironment:
      - OPERATOR_ROUNDS_MEDIA_ENDPOINT
      - OPERATOR_ROUNDS_MEDIA_PUBLIC_ENDPOINT
      - OPERATOR_ROUNDS_MEDIA_REGION
      - OPERATOR_ROUNDS_MEDIA_BUCKET
      - OPERATOR_ROUNDS_MEDIA_ACCESS_KEY
      - OPERATOR_ROUNDS_MEDIA_SECRET_KEY
      - OPERATOR_ROUNDS_RELAY_CMMS_URL
      - OPERATOR_ROUNDS_CMMS_INBOX_RELAY_PRIVATE_KEY_BASE64
      - OPERATOR_ROUNDS_RELAY_INTERVAL_MS
      - OPERATOR_ROUNDS_CMMS_INBOX_PATH
      - OPERATOR_ROUNDS_RELAY_WORKFORCE_URL
      - OPERATOR_ROUNDS_WORKFORCE_INBOX_RELAY_PRIVATE_KEY_BASE64
      - OPERATOR_ROUNDS_WORKFORCE_INBOX_PATH
      - OPERATOR_ROUNDS_RELAY_ANALYTICS_URL
      - OPERATOR_ROUNDS_ANALYTICS_INBOX_RELAY_PRIVATE_KEY_BASE64
  conformance:
    collection: v1/routes
    requestKeyInBody: true
    versionInBody: true
    uppercaseCode: true
    create:
      code: ROUND-PROBE
      title: Conformance inspection route
      description: null
      owningUnitId: null
      placeRef: null
      schedule:
        cadence: DAILY
        timeZone: UTC
        localTime: '08:00'
        graceMinutes: 0
        windowMinutes: 60
    update:
      title: Conformance inspection route updated
  catalog:
    - key: operator-rounds
      name: Operator Inspection Rounds
      navigationLabel: Operator Inspection Rounds
      area: Operator Inspection Rounds
      navigationGroup: Workforce & Operations
      route: /operator-rounds
      iconKey: scan-line
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: operator-rounds.routes.read
      platformInspection: false
      reason: WI-OI-133 Built in source; raise to REVIEW after `pnpm module:conformance operator-rounds --live --record` on a rebuilt module-host with `.env.test.module.operator-rounds`.
      navigationOrder: 370
      personas: [OPERATIONS_SUPERVISOR]
      roles:
        - key: rounds-operator
          name: Rounds Operator
          description: Executes assigned inspection rounds and records evidence.
          permissions: [operator-rounds.routes.read, operator-rounds.runs.execute]
        - key: rounds-supervisor
          name: Rounds Supervisor
          description: Assigns rounds and reviews progress and exceptions.
          permissions: [operator-rounds.routes.read, operator-rounds.assignments.manage, operator-rounds.board.read, operator-rounds.exceptions.read, operator-rounds.exceptions.review, operator-rounds.runs.execute, operator-rounds.skips.approve]
        - key: rounds-engineer
          name: Rounds Reliability Engineer
          description: Builds and publishes routes and thresholds.
          permissions: [operator-rounds.routes.read, operator-rounds.routes.manage, operator-rounds.routes.publish, operator-rounds.board.read, operator-rounds.exceptions.read]
  # Web gateway (WI-OI-083): the BFF reaches only these routes, as the user, with a freshly signed context.
  gateway:
    basePaths: [/api/operator-rounds]
    catalogKey: operator-rounds
    audience: gigalibs-operator-rounds-api
    upstream: operator-rounds
    signingKeyEnvironment: OPERATOR_ROUNDS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: OPERATOR_ROUNDS
    routeNoun: Operator Inspection Rounds
    serviceName: Operator Inspection Rounds
    entitlementName: Operator Inspection Rounds
    routes:
      - { path: 'v1/routes', GET: operator-rounds.routes.read, POST: operator-rounds.routes.manage }
      - { path: 'v1/routes/{id}', GET: operator-rounds.routes.read, PATCH: operator-rounds.routes.manage }
      - { path: 'v1/routes/{id}/checkpoints', POST: operator-rounds.routes.manage }
      - { path: 'v1/routes/{id}/checkpoint-batches', POST: operator-rounds.routes.manage }
      - { path: 'v1/routes/{id}/checkpoints/finalize', POST: operator-rounds.routes.manage }
      - { path: 'v1/routes/{id}/publish', POST: operator-rounds.routes.publish }
      - { path: 'v1/routes/{id}/assignments', POST: operator-rounds.assignments.manage }
      - { path: 'v1/routes/{id}/roster', GET: operator-rounds.assignments.manage, POST: operator-rounds.assignments.manage }
      - { path: 'v1/routes/{id}/generate', POST: operator-rounds.assignments.manage }
      - { path: 'v1/assignments/mine', GET: operator-rounds.runs.execute }
      - { path: 'v1/assignments/board', GET: operator-rounds.board.read }
      - { path: 'v1/assignments/{id}/bundle', GET: operator-rounds.runs.execute }
      - { path: 'v1/sync', POST: operator-rounds.runs.execute }
      - { path: 'v1/receipts/{id}', GET: operator-rounds.runs.execute }
      - { path: 'v1/evidence', POST: operator-rounds.runs.execute }
      - { path: 'v1/evidence/{id}/commit', POST: operator-rounds.runs.execute }
      - { path: 'v1/exceptions', GET: operator-rounds.exceptions.read }
      - { path: 'v1/exceptions/{id}', PATCH: operator-rounds.exceptions.review }
      - { path: 'v1/exceptions/{id}/retry', POST: operator-rounds.exceptions.review }
      - { path: 'v1/skips', GET: operator-rounds.skips.approve }
      - { path: 'v1/skips/{id}/decision', POST: operator-rounds.skips.approve }
      - { path: 'v1/organization/versions/{id}/units', POST: 'organization:activate' }
      - { path: 'v1/organization/versions/{id}/complete', POST: 'organization:activate' }
