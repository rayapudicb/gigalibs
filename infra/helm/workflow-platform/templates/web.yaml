apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workflow-platform.fullname" . }}-web
  labels:
    {{- include "workflow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.replicas.web }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "workflow-platform.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "workflow-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "workflow-platform.serviceAccount" . }}
      containers:
        - name: web
          image: {{ include "workflow-platform.image" (dict "Values" .Values "Chart" .Chart "component" "web") }}
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: NEXTAUTH_URL
              value: "https://{{ .Values.ingress.host }}"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.sessionSecretKey }}
            - name: CONTROL_PLANE_URL
              value: "http://{{ include "workflow-platform.fullname" . }}-api:3333"
            - name: CMMS_API_URL
              value: {{ required "cmms.baseUrl is required" .Values.cmms.baseUrl | quote }}
            - name: PLATFORM_CONTEXT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.secretName }}
                  key: {{ .Values.auth.platformContextPrivateKeyKey }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-platform.fullname" . }}-web
  labels:
    {{- include "workflow-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "workflow-platform.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: web
