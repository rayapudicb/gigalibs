apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-inventory
  displayName: Universal Inventory & Warehouse Operations
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-124
spec:
  standalone: true
  category: business
  requiredModules: [product-catalogue]
  optionalModules: [physical-operations-cmms, universal-connector-hub, analytics-studio]
  capabilities:
    - warehouses-and-locations
    - stock-ledger
    - stock-balances
    - lot-and-serial-traceability
    - receiving-and-putaway
    - transfers-and-issues
    - work-order-reservations
    - maintenance-kitting-and-staging
    - cycle-counts-and-adjustments
    - maker-checker-approvals
    - barcode-scanning
    - outbox-events
    - audit
  plannedCapabilities:
    - automated-replenishment
    - operational-valuation-layers
    - offline-sync-queue
  ui:
    basePath: /inventory
    package: '@gigalibs/universal-inventory-web'
    pages:
      # WI-OI-145: one sidebar entry and one route per screen.
      - route: /inventory
        component: UniversalInventoryWorkspace
        props:
          section: warehouses
        sessionPermissions: true
      - route: /inventory/items
        component: UniversalInventoryWorkspace
        props:
          section: items
        sessionPermissions: true
      - route: /inventory/lots
        component: UniversalInventoryWorkspace
        props:
          section: lots
        sessionPermissions: true
      - route: /inventory/receipts
        component: UniversalInventoryWorkspace
        props:
          section: receipts
        sessionPermissions: true
      - route: /inventory/balances
        component: UniversalInventoryWorkspace
        props:
          section: balances
        sessionPermissions: true
      - route: /inventory/reservations
        component: UniversalInventoryWorkspace
        props:
          section: reservations
        sessionPermissions: true
      - route: /inventory/ledger
        component: UniversalInventoryWorkspace
        props:
          section: ledger
        sessionPermissions: true
      - route: /inventory/movement-costs
        component: UniversalInventoryWorkspace
        props:
          section: movement-costs
        sessionPermissions: true
      - route: /inventory/posted-receipt-costs
        component: UniversalInventoryWorkspace
        props:
          section: posted-receipt-costs
        sessionPermissions: true
      - route: /inventory/warehouse-map
        component: UniversalInventoryWorkspace
        props:
          section: warehouse-map
        sessionPermissions: true
      - route: /inventory/transfers
        component: UniversalInventoryWorkspace
        props:
          section: transfers
        sessionPermissions: true
      - route: /inventory/replenishment
        component: UniversalInventoryWorkspace
        props:
          section: replenishment
        sessionPermissions: true
      - route: /inventory/availability
        component: UniversalInventoryWorkspace
        props:
          section: availability
        sessionPermissions: true
      - route: /inventory/valuation
        component: UniversalInventoryWorkspace
        props:
          section: valuation
        sessionPermissions: true
      - route: /inventory/barcode
        component: UniversalInventoryWorkspace
        props:
          section: barcode
        sessionPermissions: true
  conformance:
    collection: v1/records/inventory.warehouses
    grantedScopes:
      - inventory.read
      - inventory.records.read
      - inventory.records.manage
      - inventory.warehouses.manage
    create:
      code: CONC-PROBE
      name: Conformance probe warehouse
      warehouse-type: PHYSICAL
    update:
      name: Conformance probe warehouse updated
  api:
    application: apps/api
    port: 4790
    upstream:
      key: universal-inventory
      serviceHostname: module-host
      environmentKey: UNIVERSAL_INVENTORY_API_URL
      basePath: /universal-inventory
    version: v1
  events:
    emits:
      - inventory.receipt.completed.v1
      - inventory.stock.moved.v1
      - inventory.balance.changed.v1
      - inventory.reservation.changed.v1
      - inventory.stock.issued.v1
      - inventory.valuation.setting.updated.v1
      - inventory.kit.staged.v1
      - inventory.kit.issued.v1
      - inventory.count.closed.v1
      - inventory.adjustment.approved.v1
      - inventory.transfer.dispatched.v1
      - inventory.transfer.received.v1
      - inventory.replenishment.po-draft.v1
    consumes:
      - finance.inventory-receipt.posting-outcome.v1
      - finance.fiscal-period.state-changed.v1
      - finance.fiscal-period.snapshot-completed.v1
      - finance.inventory.landed-cost-adjusted.v1
      - platform.authorization.revoked.v1
      - platform.organization.version.v1
      - product.created.v1
      - product.updated.v1
  identity:
    protocol: signed-platform-context-v1
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_inventory
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  runtime:
    generated: true
    hosting: host
    appendOnlyTables: [audit_events]
    readOnlyTables: [auth_revocation_events]
  catalog:
    - key: universal-inventory
      name: Universal Inventory & Warehouses
      navigationLabel: Inventory
      area: Workforce & Operations
      navigationGroup: Workforce & Operations
      route: /inventory
      iconKey: boxes
      readiness: PLANNED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: inventory.read
      platformInspection: true
      reason: Material Ledger parity (WI-OI-124) extends the WI-OI-091 inventory boundary; remains PLANNED until live module conformance and independent review are recorded.
      navigationOrder: 126
      personas: [OPERATIONS_SUPERVISOR]
      menu:
        - key: warehouses
          label: Warehouses
          path: /inventory
          icon: building
        - key: items
          label: Items
          path: /inventory/items
          icon: boxes
        - key: lots
          label: Lots
          path: /inventory/lots
          icon: layers
        - key: receipts
          label: Receipts
          path: /inventory/receipts
          icon: inbox
        - key: balances
          label: Balances
          path: /inventory/balances
          icon: database
        - key: reservations
          label: Reservations
          path: /inventory/reservations
          icon: lock
        - key: ledger
          label: Stock ledger
          path: /inventory/ledger
          icon: file-text
        - key: movement-costs
          label: Movement costs
          path: /inventory/movement-costs
          icon: coins
        - key: posted-receipt-costs
          label: Posted receipt costs
          path: /inventory/posted-receipt-costs
          icon: file-check
        - key: warehouse-map
          label: Warehouse map
          path: /inventory/warehouse-map
          icon: map-pin
        - key: transfers
          label: Transfers
          path: /inventory/transfers
          icon: arrow-left-right
        - key: replenishment
          label: Replenishment
          path: /inventory/replenishment
          icon: gauge
        - key: availability
          label: Availability
          path: /inventory/availability
          icon: check-circle
        - key: valuation
          label: Valuation setup
          path: /inventory/valuation
          icon: scale
        - key: barcode
          label: Barcode lookup
          path: /inventory/barcode
          icon: scan-line
      roles:
        - key: inventory-operator
          name: Inventory Operator
          description: Executes warehouse receiving, putaway, transfers, picks, kitting and counts.
          permissions: [inventory.read, inventory.receive, inventory.putaway, inventory.transfer, inventory.issue, inventory.return, inventory.count, 'inventory.kits.read']
        - key: inventory-controller
          name: Inventory Controller
          description: Manages warehouses, locations, reservations, kits, and four-eyes count adjustments.
          permissions: [inventory.read, 'inventory.ledger.read', 'inventory.warehouses.manage', 'inventory.items.manage', inventory.reserve, 'inventory.counts.approve', inventory.adjust, 'inventory.adjust.approve', 'inventory.kits.manage']
  gateway:
    basePaths: [/api/universal-inventory]
    catalogKey: universal-inventory
    audience: gigalibs-universal-inventory-api
    upstream: universal-inventory
    signingKeyEnvironment: UNIVERSAL_INVENTORY_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: UNIVERSAL_INVENTORY
    routeNoun: Universal Inventory
    serviceName: Universal Inventory & Warehouse Operations
    entitlementName: Universal Inventory
    # WI-OI-120f (F0.3/F0.5): the module SDK's record routes for metadata windows and lookups.
    records: true
    routes:
      - { path: 'v1/records', GET: inventory.records.read, POST: inventory.records.manage }
      - { path: 'v1/records/{id}', GET: inventory.records.read, PATCH: inventory.records.manage }
      - { path: 'v1/warehouses', GET: inventory.read, POST: 'inventory.warehouses.manage' }
      - { path: 'v1/warehouses/{id}', GET: inventory.read, PATCH: 'inventory.warehouses.manage' }
      - { path: 'v1/warehouses/{id}/location-map', GET: inventory.read }
      - { path: 'v1/cost-layers', GET: 'inventory.ledger.read' }
      - { path: 'v1/posted-receipt-costs', GET: 'inventory.ledger.read' }
      - { path: 'v1/valuation-settings', GET: 'inventory.items.manage', PUT: 'inventory.items.manage' }
      - { path: 'v1/locations', GET: inventory.read, POST: 'inventory.warehouses.manage' }
      - { path: 'v1/items', GET: inventory.read, POST: 'inventory.items.manage' }
      - { path: 'v1/lots', GET: inventory.read, POST: inventory.receive }
      - { path: 'v1/atp/check', POST: inventory.read }
      - { path: 'v1/reserve-release', POST: inventory.reserve }
      - { path: 'v1/balances', GET: inventory.read }
      - { path: 'v1/ledger', GET: 'inventory.ledger.read' }
      - { path: 'v1/movements', POST: inventory.transfer }
      - { path: 'v1/movements/{id}/reverse', POST: inventory.transfer }
      - { path: 'v1/receipts', GET: inventory.read, POST: inventory.receive }
      - { path: 'v1/receipts/{id}/complete', POST: inventory.receive }
      - { path: 'v1/receipts/{id}/retry-posting', POST: inventory.receive }
      - { path: 'v1/transfers', GET: inventory.read, POST: inventory.transfer }
      - { path: 'v1/transfers/{id}', GET: inventory.read }
      - { path: 'v1/transfers/{id}/dispatch', POST: inventory.transfer }
      - { path: 'v1/transfers/{id}/receive', POST: inventory.receive }
      - { path: 'v1/replenish-rules', GET: inventory.read, POST: 'inventory.items.manage' }
      - { path: 'v1/replenish-radar', GET: inventory.read }
      - { path: 'v1/replenish-pos', POST: 'inventory.items.manage' }
      - { path: 'v1/reservations', GET: inventory.read, POST: inventory.reserve }
      - { path: 'v1/reservations/{id}/release', POST: inventory.reserve }
      - { path: 'v1/reservations/{id}/issue', POST: inventory.issue }
      - { path: 'v1/kits', GET: 'inventory.kits.read', POST: 'inventory.kits.manage' }
      - { path: 'v1/kits/{id}/stage', POST: 'inventory.kits.manage' }
      - { path: 'v1/kits/{id}/issue', POST: inventory.issue }
      - { path: 'v1/kits/{id}/return', POST: inventory.return }
      - { path: 'v1/count-plans', GET: inventory.read, POST: 'inventory.counts.approve' }
      - { path: 'v1/count-entries', POST: inventory.count }
      - { path: 'v1/adjustments', GET: inventory.read, POST: inventory.adjust }
      - { path: 'v1/adjustments/{id}/approve', POST: 'inventory.adjust.approve' }
      - { path: 'v1/barcodes/resolve', POST: inventory.read }
  # WI-OI-152 (ADR-0037 §3): the masters this module keeps, listed in the Master data area.
  masters:
    - { label: Warehouses, group: products-and-stock, route: /inventory, records: inventory.warehouses }
    - { label: Stock items, group: products-and-stock, route: /inventory/items, records: inventory.items }
    - { label: Lots and serials, group: products-and-stock, route: /inventory/lots, records: inventory.lots }
