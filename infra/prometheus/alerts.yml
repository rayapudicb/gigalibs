groups:
  - name: gigalibs-control-plane-alerts
    rules:
      - alert: ControlPlaneMetricsCollectorFailed
        expr: gigalibs_metrics_collection_success{collector="database"} == 0
        for: 2m
        labels:
          severity: critical
          tier: control-plane
        annotations:
          summary: "Control-plane metrics database collector failed"
          description: "Database collector has returned 0 for > 2 minutes. Metrics may be stale or database is unreachable."
          runbook_url: "docs/runbooks/control-plane-metrics.md"

      - alert: ControlPlaneOutboxBacklogHigh
        expr: sum(gigalibs_control_outbox_events{status="PENDING"}) > 100
        for: 5m
        labels:
          severity: warning
          tier: control-plane
        annotations:
          summary: "Control plane outbox backlog is accumulating"
          description: "Over 100 pending outbox events for > 5 minutes. Check outbox publisher worker health."
          runbook_url: "docs/runbooks/control-plane-metrics.md"

      - alert: ControlPlaneHigh5xxRate
        expr: sum(rate(gigalibs_http_requests_total{status=~"5.."}[5m])) / sum(rate(gigalibs_http_requests_total[5m])) * 100 > 1
        for: 3m
        labels:
          severity: critical
          tier: control-plane
        annotations:
          summary: "Control plane HTTP 5xx error rate > 1%"
          description: "HTTP 5xx error rate has exceeded 1% of total traffic over the last 5 minutes."
          runbook_url: "docs/runbooks/control-plane-metrics.md"

      - alert: ControlPlaneHighP99Latency
        expr: histogram_quantile(0.99, sum(rate(gigalibs_http_request_duration_seconds_bucket[5m])) by (le)) > 1.0
        for: 5m
        labels:
          severity: warning
          tier: control-plane
        annotations:
          summary: "Control plane P99 latency > 1000ms"
          description: "99th percentile request duration exceeds 1 second for 5 consecutive minutes."
          runbook_url: "docs/runbooks/control-plane-metrics.md"

  - name: gigalibs-configuration-studio-alerts
    rules:
      - alert: ConfigurationStudioOutboxFailed
        expr: sum(gigalibs_configuration_outbox_events{status="FAILED"}) > 0
        for: 2m
        labels:
          severity: critical
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration Studio outbox delivery failed"
          description: "At least one governed configuration event is in FAILED state. Activation consumers may not have converged."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

      - alert: ConfigurationStudioOutboxPendingTooLong
        expr: gigalibs_configuration_outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: warning
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration Studio event delivery is delayed"
          description: "The oldest pending configuration event is more than five minutes old."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

      - alert: ConfigurationStudioReviewBacklogStale
        expr: gigalibs_configuration_submitted_change_sets_older_than_24h > 0
        for: 30m
        labels:
          severity: warning
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration review backlog contains stale submissions"
          description: "One or more submitted change sets have awaited an independent review for over 24 hours."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

      - alert: ConfigurationStudioReadP95LatencyHigh
        expr: histogram_quantile(0.95, sum(rate(gigalibs_http_request_duration_seconds_bucket{method="GET",route=~".*/configuration/(runtime/manifest|apps/.*)"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration Studio read p95 exceeds two seconds"
          description: "Runtime-manifest or tenant-application read p95 has exceeded the provisional NFR-PERF-002 budget for five minutes."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

      - alert: ConfigurationStudioDatabaseUnavailable
        expr: sum(rate(gigalibs_http_requests_total{route=~".*/configuration/.*",status="503"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration Studio persistence is unavailable"
          description: "Configuration requests have returned sanitized retryable database-unavailable responses for two minutes."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

      - alert: ConfigurationStudioManifestConsumerDisconnected
        expr: gigalibs_configuration_manifest_listener_connected == 0
        for: 2m
        labels:
          severity: critical
          tier: control-plane
          module: configuration-studio
        annotations:
          summary: "Configuration Studio manifest invalidation listener is disconnected"
          description: "The replica is bypassing its manifest cache because the PostgreSQL invalidation listener has remained disconnected for two minutes."
          runbook_url: "docs/runbooks/configuration-studio-operations.md"

  - name: gigalibs-execution-plane-alerts
    rules:
      - alert: ExecutionPlaneMetricsCollectorFailed
        expr: gigalibs_execution_metrics_collection_success == 0
        for: 2m
        labels:
          severity: critical
          tier: execution-plane
        annotations:
          summary: "Execution plane metrics collector failed"
          description: "Execution plane metrics database collection has failed for > 2 minutes."
          runbook_url: "docs/runbooks/execution-plane-metrics.md"

      - alert: ExecutionPlaneQuarantinedRunsDetected
        expr: sum(gigalibs_execution_runs{status="QUARANTINED"}) > 0
        for: 1m
        labels:
          severity: warning
          tier: execution-plane
        annotations:
          summary: "Quarantined execution runs in Dead-Letter Queue (DLQ)"
          description: "One or more workflow runs have entered quarantine and require operator intervention or retry."
          runbook_url: "docs/runbooks/execution-plane-metrics.md"

      - alert: ExecutionPlaneOutboxBacklogHigh
        expr: sum(gigalibs_execution_outbox_events{state="PENDING"}) > 50
        for: 5m
        labels:
          severity: warning
          tier: execution-plane
        annotations:
          summary: "Execution plane outbox backlog is growing"
          description: "Over 50 pending events in execution outbox for > 5 minutes."
