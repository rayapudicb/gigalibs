apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-data-studio
  displayName: Universal Data Studio & Enterprise Data Contract Engine
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-023
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules:
    - multi-currency
    - accounts-receivable
    - spend-management
    - tax-configuration
  capabilities:
    - data-contracts
    - schema-drift-detection
    - field-mapping-studio
    - currency-normalization
    - quality-assertions
    - cross-module-lineage
    - audit-log
  ui:
    application: apps/workflow-platform
    basePath: /data-contracts
  api:
    application: apps/api
    port: 3800
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_data_studio
    crossSchemaAccess: false
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: data-contracts
      name: Data Contracts
      navigationLabel: Data Contracts & Schemas
      area: Data
      navigationGroup: Data & Documents
      route: /data-contracts
      iconKey: database
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: contracts:read
      platformInspection: false
      reason: Universal Data Studio & Data Contracts Engine with JSONSchema validation and schema drift detection.
      navigationOrder: 80
