name: gigalibs-configuration-local

# WI-OI-059 additive module-runtime profile. Render with compose.yaml and both
# infra/compose/.env plus infra/compose/.env.modules. No module port is published.
services:
  connector-hub-migrations:
    image: ${CONNECTOR_HUB_IMAGE:?CONNECTOR_HUB_IMAGE is required}
    pull_policy: never
    command: ["run-module-migrations.mjs"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${MODULE_MIGRATIONS_DATABASE_URL:?MODULE_MIGRATIONS_DATABASE_URL is required}
      MODULE_RUNTIME_DATABASE_URL: ${CONNECTORS_DATABASE_URL:?CONNECTORS_DATABASE_URL is required}
      MODULE_MIGRATIONS_DIRECTORY: /app/migrations
      MODULE_SCHEMA: gigalibs_connectors
      MODULE_EXPECTED_MIGRATION_VERSION: "8"
      MODULE_APPEND_ONLY_TABLES: audit_events
      MODULE_READ_ONLY_TABLES: connector_definitions,auth_revocation_events
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: &module-labels
      com.gigalibs.profile-key: module-runtime-local-development-v1
      com.gigalibs.execution-class: LOCAL_DEVELOPMENT
      com.gigalibs.release-id: ${RELEASE_ID:?RELEASE_ID is required}
      org.opencontainers.image.revision: ${SOURCE_REVISION:?SOURCE_REVISION is required}
      com.gigalibs.source-state-sha256: ${SOURCE_STATE_SHA256:?SOURCE_STATE_SHA256 is required}

  connector-hub-api:
    image: ${CONNECTOR_HUB_IMAGE:?CONNECTOR_HUB_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: development
      CONNECTOR_HUB_API_HOST: 0.0.0.0
      CONNECTOR_HUB_API_PORT: "4100"
      CONNECTOR_HUB_CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CONNECTORS_DATABASE_URL: ${CONNECTORS_DATABASE_URL:?CONNECTORS_DATABASE_URL is required}
      CONNECTOR_HUB_DATABASE_POOL_SIZE: "10"
      CONNECTOR_HUB_EXPECTED_MIGRATION_VERSION: "8"
      # WI-OI-104a: tenant authority only from a context the web BFF signed for Connector Hub.
      CONNECTOR_HUB_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${CONNECTOR_HUB_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?CONNECTOR_HUB_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      CONNECTOR_VAULT_KEY: ${CONNECTOR_VAULT_KEY:?CONNECTOR_VAULT_KEY is required}
      CONNECTOR_HUB_ALLOWED_OUTBOUND_HOSTS: ${CONNECTOR_HUB_ALLOWED_OUTBOUND_HOSTS:?CONNECTOR_HUB_ALLOWED_OUTBOUND_HOSTS is required}
      CONNECTOR_HUB_ALLOW_INSECURE_OUTBOUND: "false"
      # WI-OI-104e: pulled records reach the Analytics inbox through the outbox relay (ADR-0007).
      CONNECTOR_HUB_RELAY_ANALYTICS_URL: http://analytics-api:4400
      ANALYTICS_INBOX_RELAY_PRIVATE_KEY_BASE64: ${ANALYTICS_INBOX_RELAY_PRIVATE_KEY_BASE64:?ANALYTICS_INBOX_RELAY_PRIVATE_KEY_BASE64 is required}
      # WI-OI-105e: records sent as places reach the Geospatial inbox through a second relay, with its own key.
      CONNECTOR_HUB_RELAY_GEOSPATIAL_URL: http://geospatial-api:4720
      GEOSPATIAL_HUB_INBOX_RELAY_PRIVATE_KEY_BASE64: ${GEOSPATIAL_HUB_INBOX_RELAY_PRIVATE_KEY_BASE64:?GEOSPATIAL_HUB_INBOX_RELAY_PRIVATE_KEY_BASE64 is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      connector-hub-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4100/api/connectors/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  analytics-migrations:
    image: ${ANALYTICS_IMAGE:?ANALYTICS_IMAGE is required}
    pull_policy: never
    command: ["run-module-migrations.mjs"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${MODULE_MIGRATIONS_DATABASE_URL:?MODULE_MIGRATIONS_DATABASE_URL is required}
      MODULE_RUNTIME_DATABASE_URL: ${ANALYTICS_DATABASE_URL:?ANALYTICS_DATABASE_URL is required}
      MODULE_MIGRATIONS_DIRECTORY: /app/migrations
      MODULE_SCHEMA: gigalibs_analytics
      MODULE_EXPECTED_MIGRATION_VERSION: "25"
      MODULE_APPEND_ONLY_TABLES: raw_record_versions,studio_mapping_versions,report_artifacts,report_deliveries,analytics_lineage_edges,analytics_audit_log,operational_facts,formula_measure_versions,formula_measure_reviews
      MODULE_READ_ONLY_TABLES: auth_revocation_events
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  analytics-api:
    image: ${ANALYTICS_IMAGE:?ANALYTICS_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: development
      ANALYTICS_API_HOST: 0.0.0.0
      ANALYTICS_API_PORT: "4400"
      ANALYTICS_CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      ANALYTICS_DATABASE_URL: ${ANALYTICS_DATABASE_URL:?ANALYTICS_DATABASE_URL is required}
      ANALYTICS_DATABASE_POOL_SIZE: "10"
      ANALYTICS_EXPECTED_MIGRATION_VERSION: "25"
      ANALYTICS_PLATFORM_CONTEXT_AUDIENCE: gigalibs-analytics-api
      ANALYTICS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${ANALYTICS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?ANALYTICS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      ANALYTICS_INBOX_RELAY_PUBLIC_KEY_BASE64: ${ANALYTICS_INBOX_RELAY_PUBLIC_KEY_BASE64:?ANALYTICS_INBOX_RELAY_PUBLIC_KEY_BASE64 is required}
      ANALYTICS_GEOSPATIAL_INBOX_RELAY_PUBLIC_KEY_BASE64: ${ANALYTICS_GEOSPATIAL_INBOX_RELAY_PUBLIC_KEY_BASE64:?ANALYTICS_GEOSPATIAL_INBOX_RELAY_PUBLIC_KEY_BASE64 is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      analytics-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4400/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  # WI-OI-038: CMMS core runtime. Installs only db/runtime-manifest.txt; the runtime role may read, never write,
  # revocations, and history, labour, readings, stock movements and audit are append-only.
  cmms-migrations:
    image: ${CMMS_IMAGE:?CMMS_IMAGE is required}
    pull_policy: never
    command: ["run-module-migrations.mjs"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      DATABASE_URL: ${MODULE_MIGRATIONS_DATABASE_URL:?MODULE_MIGRATIONS_DATABASE_URL is required}
      MODULE_RUNTIME_DATABASE_URL: ${CMMS_DATABASE_URL:?CMMS_DATABASE_URL is required}
      MODULE_MIGRATIONS_DIRECTORY: /app/migrations
      MODULE_SCHEMA: gigalibs_cmms
      MODULE_EXPECTED_MIGRATION_VERSION: "14"
      MODULE_APPEND_ONLY_TABLES: audit_events,work_order_events,work_order_labour,meter_readings,stock_movements
      MODULE_READ_ONLY_TABLES: auth_revocation_events
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  cmms-api:
    image: ${CMMS_IMAGE:?CMMS_IMAGE is required}
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: development
      CMMS_API_HOST: 0.0.0.0
      CMMS_API_PORT: "4200"
      CMMS_CORS_ORIGINS: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      CMMS_DATABASE_URL: ${CMMS_DATABASE_URL:?CMMS_DATABASE_URL is required}
      CMMS_DATABASE_POOL_SIZE: "10"
      CMMS_EXPECTED_MIGRATION_VERSION: "14"
      CMMS_PLATFORM_CONTEXT_AUDIENCE: gigalibs-cmms-api
      CMMS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64: ${CMMS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64:?CMMS_PLATFORM_CONTEXT_PUBLIC_KEY_BASE64 is required}
      # WI-OI-068 (ADR-0007 option A); keys from scripts/generate-relay-credentials.sh.
      CMMS_INBOX_RELAY_PUBLIC_KEY_BASE64: ${CMMS_INBOX_RELAY_PUBLIC_KEY_BASE64:?CMMS_INBOX_RELAY_PUBLIC_KEY_BASE64 is required}
      CMMS_RELAY_WORKFORCE_URL: http://workforce-api:4700
      WORKFORCE_INBOX_RELAY_PRIVATE_KEY_BASE64: ${WORKFORCE_INBOX_RELAY_PRIVATE_KEY_BASE64:?WORKFORCE_INBOX_RELAY_PRIVATE_KEY_BASE64 is required}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      cmms-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4200/v1/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  # WI-OI-104c (ADR-0017): Redis carries only BullMQ job ids; PostgreSQL holds every job and schedule, so Redis keeps
  # nothing on disk and never evicts. Internal network only, password required.
  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data:rw,noexec,nosuid,size=64m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --requirepass "$$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  # WI-OI-104c: turns due schedules into jobs and runs them, calling modules as each schedule's owner with a context
  # signed for that module only. Same image as the core API; no published port.
  kernel-worker:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: never
    command: ["dist/kernel-worker/main.js"]
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:?JWT_ACCESS_EXPIRES_IN is required}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:?JWT_REFRESH_EXPIRES_IN is required}
      CONTROL_PAYLOAD_ENCRYPTION_KEY: ${CONTROL_PAYLOAD_ENCRYPTION_KEY:?CONTROL_PAYLOAD_ENCRYPTION_KEY is required}
      CONTROL_PAYLOAD_KEY_VERSION: ${CONTROL_PAYLOAD_KEY_VERSION:?CONTROL_PAYLOAD_KEY_VERSION is required}
      CONTROL_PAYLOAD_PREVIOUS_KEYS_JSON: ${CONTROL_PAYLOAD_PREVIOUS_KEYS_JSON-}
      ANALYTICS_API_URL: http://analytics-api:4400
      ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64: ${ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64:?ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64 is required}
      CONNECTOR_HUB_API_URL: http://connector-hub-api:4100
      CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64: ${CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64:?CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64 is required}
      KERNEL_WORKER_HEALTH_PORT: "4800"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4800/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels: *module-labels

  web:
    environment:
      CONNECTOR_HUB_API_URL: http://connector-hub-api:4100
      CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64: ${CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64:?CONNECTOR_HUB_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64 is required}
      ANALYTICS_API_URL: http://analytics-api:4400
      ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64: ${ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64:?ANALYTICS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64 is required}
      CMMS_API_URL: http://cmms-api:4200
      CMMS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64: ${CMMS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64:?CMMS_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64 is required}
    # WI-OI-083c: the web shell no longer waits for module services; the gateway answers 502/503 while one is down.

networks:
  default:
    name: gigalibs-configuration-local
