apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-connector-hub
  displayName: Universal Enterprise Connector Hub
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-026
spec:
  standalone: true
  requiredModules: []
  optionalModules:
    - workflow-studio
    - universal-data-studio
    - multi-currency
    - universal-rule-pro
    - accounts-receivable
    - spend-management
  capabilities:
    - enterprise-connector-catalog
    - inbound-webhook-ingestion
    - hmac-signature-verification
    - raw-ingestion-journaling
    - idempotency-buffer
    - polling-delta-sync
    - workflow-studio-dispatch
  ui:
    application: apps/workflow-platform
    basePath: /connections
  api:
    application: apps/api
    port: 4100
  storage:
    schema: gigalibs_connectors
    tables:
      - connector_definitions
      - tenant_connections
      - connector_credentials
      - raw_ingestion_journal
      - sync_jobs
      - audit_events
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: connections
      name: Connections
      navigationLabel: Connections & Adapters
      area: Integration
      navigationGroup: Platform Administration
      route: /connections
      iconKey: connections
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: connections:read
      platformInspection: false
      reason: Universal Enterprise Connector Hub with webhook ingestion journal, CDC feeds, and SOX audit logging.
      navigationOrder: 90
    - key: connector-hub
      name: Connector Hub
      navigationLabel: 1-Click OAuth Studio
      area: Integration
      navigationGroup: Platform Administration
      route: /connections/oauth-studio
      iconKey: connector-hub
      readiness: REVIEW
      entitlementEligible: true
      trialEligible: true
      requiredPermission: connections:read
      platformInspection: false
      reason: Commercial 1-Click OAuth Handshake Studio with automated schema discovery and heartbeat monitoring.
      navigationOrder: 180
