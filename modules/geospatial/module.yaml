# Geospatial (WI-OI-063): places hierarchy, boundaries, per-tenant spatial scope and geofence evaluation.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: geospatial
  displayName: Geospatial Studio
  version: 0.1.0
  lifecycle: implementation
  workItem: WI-OI-063
spec:
  standalone: true
  requiredModules: []
  optionalModules: []
  capabilities:
    - places-hierarchy
    - boundaries
    - spatial-scope
    - geofence-evaluation
