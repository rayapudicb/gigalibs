apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: universal-rule-pro
  displayName: Universal Rule Pro & Policy Decision Engine
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-024
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules:
    - multi-currency
    - universal-data-studio
    - accounts-receivable
    - spend-management
    - tax-configuration
  capabilities:
    - business-policy-rules
    - tiered-inheritance
    - ast-condition-evaluator
    - dmn-decision-tables
    - real-time-fx-normalization
    - evaluation-audit-trail
  ui:
    application: apps/workflow-platform
    basePath: /rules
  api:
    application: apps/api
    port: 3900
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_rules
    crossSchemaAccess: false
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: rule-studio
      name: Universal Rule Studio
      navigationLabel: Universal Rule Pro
      area: Decisioning
      navigationGroup: Studio & Build
      route: /rules
      iconKey: scale
      readiness: CONTAINED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: true
      requiredPermission: rules:read
      platformInspection: false
      reason: Rules service code with tests; no rules stored. Not running; it becomes the one Rules capability (ADR-0016 F3). Contained (WI-OI-120ak, owner decision D3a) while the web app keeps tenant rules only in its memory.
      navigationOrder: 160
      personas: [OPERATIONS_SUPERVISOR]
