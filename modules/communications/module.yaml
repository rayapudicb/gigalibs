# Communications (WI-OI-041 programme): omnichannel messaging served by the TextFly runtime, which is not part of this workspace; this folder holds the communications schema. Frozen by the owner on 2026-09-28.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
