apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: tax-configuration
  displayName: Enterprise Tax Nexus & Multi-Jurisdiction Engine
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-021
spec:
  standalone: true
  category: capability
  requiredModules: []
  optionalModules:
    - accounts-receivable
    - spend-management
    - multi-currency
  capabilities:
    - tax-jurisdictions
    - nexus-threshold-monitoring
    - exemption-certificates
    - multi-rate-matrix
    - tax-calculation-ledger
    - outbox-events
    - audit-log
  ui:
    application: apps/workflow-platform
    basePath: /tax
  api:
    application: apps/api
    port: 3600
    version: v1
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_tax
    crossSchemaAccess: false
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: tax-configuration
      name: Tax Configuration
      navigationLabel: Tax Configuration
      area: Finance
      navigationGroup: Financial Operations
      route: /tax
      iconKey: building
      readiness: CONTAINED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: tax:read
      platformInspection: true
      reason: A bounded PostgreSQL-backed jurisdiction, rate, exemption and calculation journey is available for controlled local UAT; broader production jurisdiction coverage remains in review. Frozen and locked (ADR-0016 F6).
      navigationOrder: 130
      personas: [C_LEVEL]
