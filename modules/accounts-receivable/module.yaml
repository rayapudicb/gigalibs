# WI-OI-120gw (2026-10-19): AR API is back in the root `pnpm build` after fixing `@gigalibs/custom-fields-nest` and
# `@gigalibs/forms-engine-nest` (real modules replace index stubs). Full M-AR0 (module SDK + module-host compose) remains
# WI-OI-120gf; the service is CONTAINED and not on UAT until that card completes.
apiVersion: modules.gigalibs.io/v1
kind: Module
metadata:
  name: accounts-receivable
  displayName: Customer Invoicing and Accounts Receivable
  version: 0.1.0-dev
  lifecycle: implementation
  workItem: WI-OI-019
spec:
  standalone: true
  category: business
  requiredModules: []
  optionalModules:
    - ledger
    - subscription-metering
  capabilities:
    - customers
    - invoice-drafts
    - invoice-issue
    - committed-event-delivery
    - audit
  plannedCapabilities:
    - event-billing-summary
    - source-backed-invoice-generation
    - supplemental-invoice-families
    - markup-policies
    - missed-billing-control
    - controlled-rebilling
    - invoice-template-versions
    - configurable-numbering
    - accounting-system-reconciliation
    - document-delivery
    - payments
    - credit-notes
    - collections
    - reconciliation
    - aging
  ui:
    application: apps/web
    basePath: /ar
  api:
    application: apps/api
    port: 3400
    upstream:
      key: ar
      serviceHostname: ar-api
      environmentKey: AR_API_URL
    version: v1
    openapi: contracts/openapi.yaml
  worker:
    application: apps/worker
  events:
    asyncapi: contracts/asyncapi.yaml
    emits:
      - ar.invoice.issued.v1
    plannedEmits:
      - ar.invoice.balance-changed.v1
    consumes: []
  identity:
    protocol: signed-platform-context-v1
    tenantClaimRequired: true
    failClosed: true
  database:
    engine: postgresql
    minimumVersion: '16'
    ownsSchema: true
    defaultSchema: gigalibs_ar
    crossSchemaAccess: false
    runtimeManifest: db/runtime-manifest.txt
  deployment:
    modes:
      - suite
      - customer-cloud
      - self-contained
      - customer-postgresql-schema
    artifacts:
      - ar-web
      - ar-api
      - ar-worker
      - ar-migrations
  health:
    liveness: /health/live
    readiness: /health/ready
  commercialMeter:
    owner: subscription-metering
    usageEvent: ar.invoice.issued.v1
    dimension: issued_invoices
    idempotencyField: invoiceId
  certification:
    status: not-certified
    evidence: release/evidence-index.yaml
  # Web module catalogue entries (WI-OI-081): generated into @gigalibs/contracts by `pnpm modules:catalog`.
  catalog:
    - key: accounts-receivable
      name: Accounts Receivable
      navigationLabel: Accounts Receivable
      area: Finance
      navigationGroup: Financial Operations
      route: /ar
      iconKey: arrow-left-right
      readiness: CONTAINED
      maturity: CORE_IMPLEMENTED
      entitlementEligible: true
      trialEligible: false
      requiredPermission: ar:read
      platformInspection: true
      reason: Customer invoicing domain on local compose (M-AR0); suite BFF uses signed platform context (WI-OI-120gz).
      navigationOrder: 110
      personas: [C_LEVEL]
  gateway:
    basePaths: [/api/ar]
    catalogKey: accounts-receivable
    audience: gigalibs-ar-api
    upstream: ar
    signingKeyEnvironment: AR_PLATFORM_CONTEXT_PRIVATE_KEY_BASE64
    codePrefix: AR
    routeNoun: Accounts Receivable
    serviceName: Accounts Receivable
    entitlementName: Accounts Receivable
    records: true
    routes:
      - { path: 'v1/setup', POST: ar:write }
      - { path: 'v1/customers', GET: ar:read, POST: ar:write }
      - { path: 'v1/customers/{id}', GET: ar:read }
      - { path: 'v1/invoices', GET: ar:read, POST: ar:write }
      - { path: 'v1/invoices/aging', GET: ar:read }
      - { path: 'v1/invoices/{id}', GET: ar:read, PATCH: ar:write }
      - { path: 'v1/invoices/{id}/issue', POST: ar:issue }
      - { path: 'v1/invoices/{id}/deliver', POST: ar:write }
      - { path: 'v1/invoices/{id}/deliveries', GET: ar:read }
      - { path: 'v1/invoices/{id}/pdf', GET: ar:read }
      - { path: 'v1/invoices/{id}/payments', GET: ar:read, POST: ar:write }
      - { path: 'v1/invoices/{id}/checkout-session', POST: ar:write }
      - { path: 'v1/invoices/{id}/download-url', GET: ar:read }
      - { path: 'v1/invoices/{id}/void', GET: ar:read, POST: ar:write }
      - { path: 'v1/invoices/{id}/credit-notes', GET: ar:read, POST: ar:write }
      - { path: 'v1/invoices/{id}/collections', GET: ar:read, POST: ar:write }
      - { path: 'v1/work-sources', POST: ar:write }
      - { path: 'v1/work-sources/{id}/records', POST: ar:write }
      - { path: 'v1/work-sources/{id}/summary', GET: ar:read }
      - { path: 'v1/work-sources/{id}/generate-invoice', POST: ar:write }
      - { path: 'v1/work-sources/{id}/family', GET: ar:read }
